<!-- Integridad verificada: si el archivo del CDN cambiara aunque sea un byte,
     el navegador se niega a ejecutarlo y la app sigue funcionando sin QR.
     El hash se calculó del archivo real y coincide con el que publica cdnjs. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"
        integrity="sha512-pUhApVQtLbnpLtJn6DuzDD5o2xtmLJnJ7oBoMsBnzOkVkpqofGLGPaBJ6ayD2zQe3lCgCibhJBi4cj5wAxwVKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    --ink:#101114;
    --paper:#ffffff;
    --muted:#6b6d75;
    --line:#e2e2e6;
    --panel:#f2f2f4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--panel);
    color:var(--ink);
    padding:22px;
    font-size:14px;
  }
  header{max-width:1400px;margin:0 auto 18px;}
  h1{font-size:18px;margin:0 0 5px;letter-spacing:-0.015em;}
  .sub{font-size:13px;color:var(--muted);margin:0;line-height:1.5;max-width:70ch;}
  .layout{display:flex;flex-direction:column;gap:18px;max-width:1400px;margin:0 auto;}
  @media (min-width:1040px){
    .layout{flex-direction:row;align-items:flex-start;}
    .controls{width:420px;flex-shrink:0;position:sticky;top:22px;}
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .topbar h1{margin:0;}
  .brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:5px;}
  .brand-desc{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.01em;}
  .topnav{display:flex;gap:6px;align-items:center;}
  .prose-lang{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);}
  .code[data-tip]{cursor:help;}
  .desc .eg{display:block;margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.4;}
  /* El selector de idioma de la pantalla se agrupa con su rótulo y un globo
     dentro de un solo recuadro: así se lee como UN control y no como un
     rótulo suelto al lado de una lista. Es el primer ajuste que hace quien
     opera, y antes pasaba desapercibido entre los botones de la barra. */
  .langgroup{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:9px;padding:4px 8px 4px 10px;background:#fff;}
  .langgroup:focus-within{outline:2px solid var(--ink);outline-offset:2px;}
  .langgroup .globe{width:15px;height:15px;flex:0 0 auto;display:block;}
  .langlbl{font-size:12px;font-weight:600;color:var(--ink);letter-spacing:0;}
  .topnav{flex-wrap:wrap;}
  .langsel{padding:2px 2px 2px 9px;border:none;border-left:1px solid var(--line);border-radius:0;font:700 13px/1.2 inherit;font-family:inherit;background:#fff;color:var(--ink);cursor:pointer;}
  .langsel:focus{outline:none;}
  .navbtn{padding:6px 12px;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:7px;font:600 12.5px/1.2 inherit;font-family:inherit;cursor:pointer;}
  .navbtn:hover{background:var(--ink);color:#fff;}
  .foot{max-width:1400px;margin:26px auto 4px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.7;color:var(--muted);}
  .foot a{color:var(--ink);}
  .foot .sep{margin:0 6px;color:#b9bbc1;}
  .foot .lic{display:inline-block;border:1px solid var(--ink);border-radius:4px;padding:0 5px;font-weight:700;color:var(--ink);font-size:10.5px;}
  .foot button{border:none;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer;}
  .dlg{border:none;border-radius:14px;padding:0;width:min(760px, calc(100vw - 32px));max-height:86vh;color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .dlg::backdrop{background:rgba(16,17,20,.55);}
  .dlg-in{padding:24px 28px 8px;overflow:auto;max-height:calc(86vh - 64px);font-size:13.5px;line-height:1.6;}
  .dlg-in h2{font-size:19px;margin:0 0 6px;}
  .dlg-in h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 6px;}
  .dlg-in .lead{color:var(--muted);margin:0 0 4px;}
  .dlg-in ol,.dlg-in ul{padding-left:20px;margin:6px 0;}
  .dlg-in li{margin-bottom:4px;}
  .dlg-in table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0;}
  .dlg-in th,.dlg-in td{text-align:left;vertical-align:top;padding:5px 8px;border-bottom:1px solid var(--line);}
  .dlg-in th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .dlg-in code{font-size:12px;background:#f2f2f4;padding:1px 4px;border-radius:4px;}
  .dlg-in .cite{border-left:3px solid var(--ink);padding-left:10px;}
  /* Cada persona que colaboró, como bloque propio: sangrado y con una línea
     a la izquierda, para que se distingan del párrafo que las presenta. */
  .dlg-in .person{margin:6px 0 6px 2px;padding-left:10px;border-left:2px solid var(--line);line-height:1.5;}
  .dlg-in .affil{margin:6px 0 0 12px;color:var(--muted);line-height:1.5;}
  .toc{border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px;margin:14px 0 4px;background:#fafafb;}
  .toc-t{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
  /* Sin viñetas ni numeración propia: los títulos del manual ya vienen
     numerados («1. Cómo generar la etiqueta»), y una lista numerada encima
     los duplicaba. */
  .toc ul{margin:0;padding-left:0;list-style:none;}
  .toc li{margin-bottom:2px;}
  .toc .tocgo{border:none;background:none;padding:0;margin:0;font:inherit;font-size:13px;color:var(--ink);text-align:left;text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
  .toc .tocgo:hover{text-decoration-thickness:2px;}
  .toc .tocgo:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px;}
  .dlg-in h3:focus{outline:none;}
  .dlg-in details summary{cursor:pointer;font-weight:600;margin-top:8px;}
  .dlg-in p.warn{border-left:3px solid var(--ink);padding-left:10px;}
  .dlg-in .lic-text{white-space:pre-wrap;font-size:11px;line-height:1.5;background:#f6f6f8;padding:10px 12px;border-radius:8px;max-height:260px;overflow:auto;}
  .prose h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;}
  .prose-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .prose-tools{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .prose-tools select{padding:5px 7px;border:1px solid #cfcfd4;border-radius:7px;font-family:inherit;font-size:12.5px;background:#fff;}
  .prose-box{font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.7;color:var(--ink);
             background:#fafafb;border:1px solid var(--line);border-radius:9px;padding:14px 16px;}
  .prose-box mark.ph{background:#ececf0;color:var(--ink);border-bottom:1.5px dashed #8a8c93;padding:0 2px;font-style:italic;}
  .dlg-foot{padding:10px 28px 16px;text-align:right;border-top:1px solid var(--line);margin:0;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;}
  fieldset{border:none;padding:0;margin:0 0 18px;}
  legend{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:9px;padding:0;}
  .task-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid #f0f0f2;}
  .task-row:last-child{border-bottom:none;}
  .tool-row{display:grid;grid-template-columns:1fr 1fr 30px;gap:6px;margin-bottom:6px;}
  .tool-row input{width:100%;min-width:0;padding:7px 8px;border:1px solid #cfcfd4;border-radius:7px;font-size:12.5px;font-family:inherit;color:var(--ink);background:#fff;}
  .tool-row .rm{border:1px solid #cfcfd4;background:#fff;border-radius:7px;cursor:pointer;font-size:16px;line-height:1;color:var(--muted);}
  .tool-row .rm:hover{color:var(--ink);border-color:var(--ink);}
  .addtool{padding:6px 10px;border:1px dashed #b9bbc1;background:#fff;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .addtool:disabled,.tool-row :disabled{opacity:.45;cursor:not-allowed;}
  #toolsBox.off{opacity:.5;}
  .task-row.off .levels{opacity:.35;}
  .task-row.off .levels button{cursor:help;}
  .task-row label{flex:1;display:flex;flex-direction:column;cursor:pointer;line-height:1.25;}
  .task-row .code{font-weight:700;font-size:13px;letter-spacing:0.01em;}
  .task-row .desc{font-size:11px;color:var(--muted);}
  .task-row .stm{font-size:9.5px;font-weight:600;color:#9a9ca3;letter-spacing:0.04em;margin-left:5px;}
  /* El primer botón lleva palabra, no símbolo, así que necesita ancho. */
  .levels button:first-child{width:52px;font-size:10.5px;}
  /* Y se distingue de los números cuando está activo: no es un nivel más
     bajo que 1, es no declarar, y pintarlo igual que un nivel confundía. */
  .levels button:first-child.active{background:#f0f0f2;color:var(--muted);border-color:#cfcfd4;font-weight:600;}
  .lvhead{display:flex;align-items:flex-end;gap:9px;padding-bottom:6px;}
  .lvhead .sp{flex:1;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  /* El rótulo es la TAPA del recuadro, así que su ancho tiene que ser
     exactamente el de la columna que cubre, o los lados no cuadran:
     52 del botón de omitir + 4×25 de los números + 4×3 de separación
     + 4+4 de relleno + 1+1 de borde = 174. El botón de omitir tiene ancho
     fijo, así que esto no cambia con el idioma. Hay una prueba que lo mide. */
  .lvhead .cap{width:calc(52px + 100px + 12px + 8px + 2px);box-sizing:border-box;text-align:center;line-height:1.25;
    font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    border:1px dashed #cfcfd4;border-bottom:none;border-radius:7px 7px 0 0;
    padding:4px 4px 3px;background:#fafafb;}
  .lvhead .cap i{display:block;font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:#9a9ca3;}
  .task-row .levels{border:1px dashed #cfcfd4;border-top:none;border-bottom:none;background:#fafafb;padding:4px;}
  .task-row .levels.fin{border-bottom:1px dashed #cfcfd4;border-radius:0 0 7px 7px;}
  /* En pantalla estrecha la columna de botones le robaba 34 px a la
     descripción de la tarea, y el bloque crecía 257 px de alto porque cada
     descripción se partía en más renglones. Debajo de 560 px los botones
     bajan a su propia línea: el texto recupera el ancho completo y el
     recuadro sigue cerrando, ahora alrededor de una fila en vez de una
     columna. */
  @media (max-width:560px){
    .task-row{flex-wrap:wrap;}
    .task-row label{flex:1 1 100%;}
    .task-row .levels{margin-left:auto;margin-top:6px;border-radius:7px;
      border:1px dashed #cfcfd4;}
    .task-row .levels.fin{border-radius:7px;}
    .lvhead .cap{border-bottom:1px dashed #cfcfd4;border-radius:7px;}
    .lvhead{padding-bottom:2px;}
  }
  .levels button:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}

  /* Guía flotante de los grados de uso. El title nativo del navegador no
     sirve: tarda ~1 s en aparecer, no se puede estilar y en pantalla táctil
     directamente no existe. Este aparece al instante, con el foco del
     teclado también, y al tocar en móvil. */
  #tip{position:fixed;z-index:99;max-width:260px;background:var(--ink);color:#fff;
       padding:8px 10px;border-radius:7px;font-size:12px;line-height:1.4;
       pointer-events:none;opacity:0;transform:translateY(3px);
       transition:opacity .12s ease,transform .12s ease;
       box-shadow:0 6px 22px rgba(0,0,0,.24);}
  #tip.on{opacity:1;transform:none;}
  #tip b{display:block;font-size:12.5px;margin-bottom:3px;}
  #tip small{color:#b3b5bc;font-size:11px;display:block;}
  #tip::after{content:'';position:absolute;left:var(--ax,50%);bottom:-5px;margin-left:-5px;
              border:5px solid transparent;border-top-color:var(--ink);border-bottom:0;}
  #tip.below::after{bottom:auto;top:-5px;border-top:0;border-bottom-color:var(--ink);}

  /* Leyenda siempre visible: para orientarse de un vistazo, sin tener que
     ir a buscar cada número con el mouse. */
  .legend{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;
          margin-top:10px;padding-top:9px;border-top:1px solid #eee;font-size:10.5px;color:var(--muted);}
  .legend .lt{font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:9.5px;}
  .legend .li{display:inline-flex;align-items:center;gap:4px;cursor:help;white-space:nowrap;}
  /* La casilla de «omitir» en la leyenda lleva palabra, no cifra: necesita
     ancho y no debe verse como un nivel más de la escala. */
  .legend .li b.wd{min-width:auto;padding:0 5px;font-size:9.5px;color:var(--muted);}
  .legend .li b{display:inline-flex;align-items:center;justify-content:center;
                min-width:16px;height:16px;border:1px solid #cfcfd4;border-radius:4px;
                font-size:10px;color:var(--ink);background:#fff;}
  .legend .li:hover b{background:var(--ink);color:#fff;border-color:var(--ink);}
  .task-row.nodecl{background:#fafafb;border-radius:7px;padding:8px;margin-top:6px;border-bottom:none;}
  .task-row.nodecl .lock{width:16px;text-align:center;color:#b9bbc1;flex-shrink:0;}
  .task-row.nodecl .desc{color:#8a8c93;}
  .tag{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:0.06em;background:#e6e6ea;color:#6b6d75;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:1px;}
  .levels{display:flex;gap:3px;}
  .levels button{width:25px;height:25px;border:1px solid #cfcfd4;background:#fff;border-radius:6px;font-size:11.5px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .levels button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);flex-shrink:0;}
  .field{margin-bottom:13px;}
  .field > label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:5px;}
  .field input[type=text],.field select{width:100%;padding:8px;border:1px solid #cfcfd4;border-radius:7px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);}
  .check{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12.5px;line-height:1.35;}
  .check span small{display:block;color:var(--muted);font-size:11px;}
  .preview-wrap{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;}
  #badgeHost{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:26px;display:flex;justify-content:center;align-items:center;min-height:180px;overflow:auto;}
  #badgeHost.dark{background:#1b1c20;}
  #badgeHost svg{max-width:100%;height:auto;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .actions button{flex:1;min-width:130px;padding:10px 12px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .actions button.secondary{background:#fff;color:var(--ink);}
  .actions button:disabled{opacity:.35;cursor:not-allowed;}
  .meta{font-size:11.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;}
  .meta b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .note{font-size:11.5px;color:var(--muted);line-height:1.5;margin:10px 0 0;}
  .empty-hint{font-size:13px;color:var(--muted);padding:34px;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand"><h1 data-i18n="appName"></h1><span class="brand-desc" data-i18n="appDesc"></span></div>
    <nav class="topnav">
      <!-- Ajuste global de quien opera la herramienta: va acá arriba y no entre
           los controles de la etiqueta, para que no se confunda con el idioma
           que SÍ entra al artículo. Opciones construidas en JS desde LANGS. -->
      <div class="langgroup">
        <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
        <label class="langlbl" for="lang" data-i18n="lblLang"></label>
        <select id="lang" class="langsel" data-i18n-tip="tipLang" data-i18n-tipsub="tipLangSub"></select>
      </div>
      <button type="button" class="navbtn" data-open="dlgManual" data-i18n="navManual"></button>
      <button type="button" class="navbtn" data-open="dlgAbout" data-i18n="navAbout"></button>
    </nav>
  </div>
  <p class="sub" style="font-size:14px;color:var(--ink);margin-bottom:10px" data-i18n="hdrTag"></p>
  <p class="sub" data-i18n="hdrOpen"></p>
  <p class="sub" style="margin-top:7px" data-i18n="hdrVocab"></p>
  <p class="sub" style="margin-top:7px" data-i18n="hdrAxes"></p>
</header>

<div class="layout">
  <div class="controls">
    <div class="card">
      <!-- Primero el idioma: gobierna la etiqueta Y la prosa, así que escogerlo
           al final obliga a releer lo ya generado. El otro eje de idioma vive

        <label class="check"><input type="checkbox" id="optDark"><span data-i18n="optDark"></span></label>

        <div class="field">

<script>
/* =========================================================================
   ETIQUETA DE DECLARACIÓN DE USO DE IA — motor de composición
   -------------------------------------------------------------------------
   Arquitectura en tres pasos, deliberadamente separados:
     1. state      -> qué declaró el autor
     2. strings    -> notación textual (Eje 1 + Eje 2)
     3. layout     -> geometría medida (sin números mágicos)
     4. render     -> string SVG puro, sin dependencia del DOM
   El paso 3 mide el texto de verdad con getBBox() antes de decidir
   posiciones, así que nada se traslapa por construcción: cada caja se
   apila a partir de la tinta real de la anterior.
   ========================================================================= */

const NS = 'http://www.w3.org/2000/svg';

/* El título tal como viene en el archivo, antes de que applyLang() lo cambie.
   Es lo único que ven los rastreadores de enlaces, y se quedó desactualizado
   durante varias versiones porque en pantalla nunca se veía. */
const STATIC_TITLE = document.title;

/* --- Vocabulario (Eje 1) --------------------------------------------------
   Fuente: preprint §4.1, que adopta las nueve actividades de STM (2025).
   `stm` es el IDENTIFICADOR CANÓNICO (el número de actividad); el código de
   dos letras es capa de despliegue, igual que en CRediT. El array está en
   orden STM ascendente porque §4.4 obliga a componer en ese orden.
   La actividad 9 no aparece: no es declarable (§4.1).
   ------------------------------------------------------------------------ */
const TASKS = [
  {code:'N',  stm:null, exclusive:true, from:'No use', gloss:{es:'sin uso', pt:'sem uso'},
   es:'Sin uso por encima del umbral declarable',
   en:'No use above the disclosable threshold',
   pt:'Sem uso acima do limiar declarável'},
  /* (**) en la lámina de STM: «2023 STM Guidelines recommend that disclosure
     is not necessary for this use of automated tools». Es el umbral del §4.5. */
  /* `eg` sale de las columnas «Examples of the activity» y «Activity does NOT
     include» de la lámina de STM, que la tabla del §4.1 no recoge porque solo
     toma el nombre. No es redefinir la actividad: es mostrar lo que la fuente
     ya dice y el artículo resume. Va VISIBLE bajo la descripción, no en la
     guía flotante, porque la duda «¿esto es la 1 o la 2?» aparece justo al
     leer la fila y quien no conoce el tema no sabe que hay algo que consultar.
     STM, actividad 1 — ejemplos: «Using spell checkers, grammar checkers, and
     similar tools (such as Microsoft 365's inbuilt editing tools) to refine
     text written primarily by humans»; no incluye: «Using AI tools to generate
     text from prompts…». */
  {code:'ED', unit:{es:'las correcciones de lenguaje', en:'the language corrections', pt:'as correções de linguagem'}, from:'Editing', gloss:{es:'edición', pt:'edição'}, stm:1, tag:'tagThreshold',
   eg:{es:'Por ejemplo, correctores ortográficos y gramaticales sobre un texto escrito principalmente por personas. No incluye generar texto a partir de indicaciones: eso es TG, la actividad 2.',
       en:'For example, spell checkers and grammar checkers on text written primarily by humans. Does not include generating text from prompts: that is TG, activity 2.',
       pt:'Por exemplo, corretores ortográficos e gramaticais sobre um texto escrito principalmente por pessoas. Não inclui gerar texto a partir de instruções: isso é TG, a atividade 2.'},
   stmNote:{
     es:'Esta tarea forma parte del umbral de declarabilidad: la guía internacional STM no pide declararla. Puede marcarla si desea declararla, o si lo pide la revista o entidad que publica o evalúa el manuscrito. Si no, déjela sin marcar; y si tampoco hubo otro uso de IA, marque N.',
     en:'This task is part of the disclosable threshold: the international STM guideline does not ask for it to be declared. You may tick it if you want to declare it, or if the journal or body that publishes or reviews the manuscript asks for it. If not, leave it unticked; and if there was no other AI use either, tick N.',
     pt:'Esta tarefa faz parte do limiar de declarabilidade: a diretriz internacional STM não pede que se declare. Pode marcá-la se quiser declará-la, ou se o pedir a revista ou entidade que publica ou avalia o manuscrito. Se não, deixe-a sem marcar; e se também não houve outro uso de IA, marque N.'},
   es:'Refinamiento, corrección, edición o formato del manuscrito para mejorar la claridad del lenguaje',
   en:'Refinement, correction, editing or formatting the manuscript to improve clarity of language',
   pt:'Refinamento, correção, edição ou formatação do manuscrito para melhorar a clareza da linguagem'},
  /* TG, no GE: la actividad 2 es generar texto del manuscrito, y TG sale de
     «Text Generation» / «Texto Generado» — funciona en los dos idiomas, que
     es lo que exige el §4.1 y lo que GE incumplía (no deriva ni de
     «escritura» ni de «writing»).
     Se valoró GT, con la misma lógica bilingüe («Generated Text» /
     «Generación de Texto») y mejor despegue de TR, con el que TG comparte
     inicial y aparece a menudo al lado: AI: TG+TR vs AI: GT+TR. Resuelto a
     favor de TG, y queda fijado: los códigos son el contrato de la notación,
     así que cambiar uno obliga a subir la versión de la NOTACIÓN, no la del
     programa. */
  {code:'TG', unit:{es:'el texto del manuscrito', en:'the manuscript text', pt:'o texto do manuscrito'}, from:'Text Generation', gloss:{es:'generación de texto', pt:'geração de texto'}, stm:2,
   es:'Escritura o redacción de contenido del manuscrito',
   en:'Writing or drafting manuscript content',
   pt:'Escrita ou redação de conteúdo do manuscrito'},
  {code:'TR', unit:{es:'el texto traducido', en:'the translated text', pt:'o texto traduzido'}, from:'Translation', gloss:{es:'traducción', pt:'tradução'}, stm:3,
   es:'Traducción del texto del manuscrito con fines de publicación',
   en:'Translation of manuscript text for the purpose of publishing',
   pt:'Tradução do texto do manuscrito para fins de publicação'},
  {code:'DA', unit:{es:'los datos reportados', en:'the reported data', pt:'os dados relatados'}, from:'Data', gloss:{es:'datos', pt:'dados'}, stm:4,
   es:'Refinamiento o formato de los datos reportados en el manuscrito',
   en:'Refining or formatting of data reported in the manuscript',
   pt:'Refinamento ou formatação dos dados relatados no manuscrito'},
  {code:'IM', unit:{es:'las imágenes y figuras', en:'the images and figures', pt:'as imagens e figuras'}, from:'Images', gloss:{es:'imágenes', pt:'imagens'}, stm:5,
   es:'Generación, refinamiento, corrección, edición o formato de imágenes, diagramas u otras figuras únicamente con fines ilustrativos',
   en:'Generation, refinement, correction, editing or formatting of images, diagrams or other figures for illustrative purposes only',
   pt:'Geração, refinamento, correção, edição ou formatação de imagens, diagramas ou outras figuras apenas para fins ilustrativos'},
  {code:'VI', unit:{es:'las visualizaciones', en:'the visualisations', pt:'as visualizações'}, from:'Visualisations', gloss:{es:'visualizaciones', pt:'visualizações'}, stm:6,
   es:'Generación, refinamiento, corrección, edición o formato de visualizaciones de datos o resultados de investigación',
   en:'Generation, refinement, correction, editing or formatting of visualisations of research data or results',
   pt:'Geração, refinamento, correção, edição ou formatação de visualizações de dados ou resultados de pesquisa'},
  {code:'CO', unit:{es:'el código', en:'the code', pt:'o código'}, from:'Code', gloss:{es:'código', pt:'código'}, stm:7,
   es:'Refinamiento o formato del código reportado en el manuscrito enviado',
   en:'Refinement or formatting of code reported in the submitted manuscript',
   pt:'Refinamento ou formatação do código relatado no manuscrito submetido'},
  /* RF se aparta a propósito de la traducción del §4.1, por dos razones que
     conviene tener escritas:
     · «Asistencia» era calco de «Assisting»; «Ayuda» es el español natural
       (corrección sugerida por un investigador con experiencia, 2026-09-23);
     · «gathering» en inglés abarca localizar las fuentes, no solo reunirlas;
       «recopilación» a secas quedaba MÁS ESTRECHO que el original, así que
       «recopilación y búsqueda» está más cerca de STM, no más lejos.
     El inglés se deja literal como lo escribió STM: es la redacción canónica.
     La divergencia está registrada en DIVERGENCIAS_41, en las pruebas, y hay
     que replicarla en la tabla del §4.1 del preprint. */
  {code:'RF', unit:{es:'las referencias', en:'the references', pt:'as referências'}, from:'References', gloss:{es:'referencias', pt:'referências'}, stm:8,
   es:'Ayuda en la recopilación y búsqueda de referencias',
   en:'Assisting with gathering references',
   pt:'Ajuda na coleta e busca de referências',
   scopeNote:{
     es:'Alcance (lectura de este sistema, no texto de STM): cubre buscar y localizar las referencias, no solo reunirlas o darles formato. Si la herramienta propuso o encontró las fuentes, se declara acá.',
     en:'Scope (this system’s reading, not STM text): covers searching for and locating references, not only collecting or formatting them. If the tool proposed or found the sources, declare it here.',
     pt:'Alcance (leitura deste sistema, não texto da STM): cobre buscar e localizar as referências, não apenas reuni-las ou formatá-las. Se a ferramenta propôs ou encontrou as fontes, declara-se aqui.'}},
  /* La actividad 9 aparece en la tabla del §4.1 pero NO es un valor
     declarable: es la única que las guías de STM recomiendan prohibir.
     Se muestra deshabilitada, no se omite, porque su ausencia de código
     es información: explica por qué no hay dónde marcarla. */
  /* (***) en la lámina de STM: «2023 STM Guidelines recommend prohibiting
     this use of AI tools». Por eso no es declarable. */
  {code:null, stm:9, declarable:false, stmNote:{
     es:'La guía internacional STM recomienda PROHIBIR este uso, no declararlo. No hay código para marcarlo: es un asunto de integridad editorial y lo resuelve la revista, no una etiqueta.',
     en:'The international STM guideline recommends PROHIBITING this use, not disclosing it. There is no code to tick: it is a matter of editorial integrity, resolved by the journal, not by a label.',
     pt:'A diretriz internacional STM recomenda PROIBIR este uso, não declará-lo. Não há código para marcar: é uma questão de integridade editorial, que a revista resolve, não uma etiqueta.'},
   es:'No declarable. Presentación de cualquier tipo de contenido generado por herramientas de IA como si fuera dato o resultado de investigación original procedente de fuentes no maquinales',
   en:'Presentation of any kind of content generated by AI tools as though it were original research data/results from non-machine sources',
   pt:'Apresentação de qualquer tipo de conteúdo gerado por ferramentas de IA como se fosse dado ou resultado de pesquisa original proveniente de fontes não maquinais'},
];

const ORDER = TASKS.filter(t=>!t.exclusive && t.declarable!==false).map(t=>t.code);  // ya en orden STM

/* --- Eje 2 — extensión del uso (preprint §4.2) ----------------------------
   Codifica CUÁNTO del componente declarado procede de la herramienta.
   NO es supervisión: §4.3 es explícito en que la verificación humana no es
   un nivel sino una afirmación única aplicable a todo el bloque.
   Es OPCIONAL: `IA-TR` es una declaración válida. Por eso el valor por
   defecto es 0 = «no declarada», y no 1.
   ------------------------------------------------------------------------ */
const EXTENTS = {
  0:{es:'no declarada',                               en:'not declared',
     pt:'não declarada',
     refEs:'',                                        refEn:'',
     refPt:''},
  1:{es:'Puntual: partes sueltas',                    en:'Incidental: scattered parts',
     pt:'Pontual: partes soltas',
     refEs:'menos de un cuarto',                      refEn:'less than a quarter',
     refPt:'menos de um quarto'},
  2:{es:'Parcial: una parte identificable',           en:'Partial: an identifiable part',
     pt:'Parcial: uma parte identificável',
     refEs:'entre un cuarto y la mitad',              refEn:'between a quarter and a half',
     refPt:'entre um quarto e a metade'},
  3:{es:'Mayoritaria: más de la mitad',               en:'Majority: more than half',
     pt:'Majoritária: mais de metade',
     refEs:'entre la mitad y tres cuartos',           refEn:'between a half and three quarters',
     refPt:'entre a metade e três quartos'},
  4:{es:'Total: prácticamente todo',                  en:'Total: practically all of it',
     pt:'Total: praticamente tudo',
     refEs:'más de tres cuartos',                     refEn:'more than three quarters',
     refPt:'mais de três quartos'},
};
const REFKEY = {es:'refEs', en:'refEn', pt:'refPt'};
const refOf = lv => EXTENTS[lv][REFKEY[lang]];


/* =========================== DICCIONARIO DE LA INTERFAZ =================
   Todo texto visible sale de acá. Antes el selector de idioma solo cambiaba
   las descripciones de las tareas y el resto quedaba en español fijo —
   tooltips incluidos. Regla: si se ve, está en UI o en un campo bilingüe
   del vocabulario; nada de literales sueltos en el DOM.
   ====================================================================== */
const UI = {
  es:{
    hdrTag:'<b>Declaración gráfica de uso de inteligencia artificial en manuscritos</b><br><span style="color:var(--muted)">Construido sobre la clasificación de nueve actividades de <b>STM (2025)</b></span>',
    hdrOpen:'Sistema de notación abierto, <b>propuesto para cualquier revista o entidad editora</b>. La etiqueta <b>no sustituye la declaración en prosa</b>: la acompaña y se genera del mismo acto declarativo, para que el dato sea comparable entre artículos, agregable en conjuntos grandes y transportable como metadato. <b>Se coloca en una página destacada del artículo</b> (habitualmente la primera) para que cualquier lector identifique de un vistazo el uso declarado. La adopción es gradual y <b>no exige modificar las políticas vigentes</b>: puede incorporar primero la etiqueta visible, después el bloque de metadatos y después la generación automática de la prosa.',
    hdrVocab:'<b>Vocabulario.</b> STM Association (2025), <i>Recommendations for a Classification of AI Use in Academic Manuscript Preparation</i>. Las nueve actividades se adoptan sin redefinirlas; ocho son declarables y la novena no, porque las guías de STM recomiendan prohibirla. El alcance es el de la fuente: solo la preparación del manuscrito, no el resto del proceso de investigación.',
    hdrAxes:'<b>Dos ejes.</b> Tipo de tarea (Eje 1) y nivel de uso (Eje 2, opcional). La verificación humana no es un nivel: es una afirmación única que cubre todo lo declarado.',
    noteThreshold:'<b>¿Qué se declara?</b> Las actividades <b>2 a 8</b> siempre, por poco que se hayan usado. La <b>1</b> (corrector, gramática, estilo) no hace falta: es el umbral. Si no hubo nada por encima, <code>AI: N</code>. Detalle en el manual, "Qué se declara y qué no".',
    legAxes:'Eje 1 · Tipo de tarea',
    lblLang:'Idioma de la pantalla',
    lblDocLang:'Idioma de la etiqueta y la prosa',
    legStart:'Antes de empezar',
    tipDocLang:'Idioma de la etiqueta y la prosa',
    tipDocLangSub:'Se recomienda el mismo idioma del artículo. Si el artículo está en una lengua que la herramienta todavía no ofrece, use inglés.',
    tipLang:'Idioma de la pantalla',
    tipLangSub:'Cambia solo lo que usted ve mientras trabaja. No entra al artículo. El idioma de la etiqueta y de la prosa se escoge más abajo, en "Etiqueta y prosa".',
    noteDocLang:'Escójalo primero: gobierna las descripciones de la etiqueta y el texto de la prosa. <b>El código NO cambia</b>: <code>AI: ED+TR+CO</code> se escribe igual en cualquier idioma.',
    lblQrUrl:'URL del QR (página explicativa)',
    legProd:'Opciones de producción',
    optQrSafe:'QR de alto contraste estándar<small>Módulos oscuros sobre placa blanca dentro del bloque negro.</small>',
    optEmbed:'Incrustar tipografía en el SVG/PNG<small>Hace el archivo reproducible fuera de esta máquina.</small>',
    optDark:'Previsualizar sobre fondo oscuro',
    lblScale:'Escala del PNG',
    sc1:'1× (pantalla)', sc2:'2× (retina / web)', sc4:'4× (impresión)',
    noteCodes:'<b>Los códigos no se traducen; las descripciones sí.</b> <code>AI</code> (sigla de <i>artificial intelligence</i>, en inglés), el "+" y los códigos de tarea (<code>ED</code>, <code>TR</code>, <code>CO</code>…) van siempre en inglés: son lo que se compara y se agrega entre revistas de cualquier país, y si se tradujeran, dos artículos que declaran exactamente lo mismo producirían cadenas distintas. Lo que sí sigue al <b>idioma de la etiqueta</b> es lo que la etiqueta dice en lengua natural ("Complementa la declaración en prosa del texto", "Más información", "Herramientas:") y la prosa de la declaración.',
    noteQr:'<b>El QR lleva a esta misma app</b>, donde quien escanee encuentra el manual y puede generar su propia etiqueta. La revista o entidad que publica puede cambiarlo por su página de política. Antes de imprimir, compruebe que la dirección sea la definitiva: un QR impreso es irrevocable.',
    noteForm:'<b>Forma de la etiqueta.</b> <code>AI</code> aparece una sola vez al inicio, seguido de ": ", y los códigos se separan con "+": <code>AI: ED+TR+CO</code>. Con nivel de uso declarado: <code>AI: ED:1+TR:3+CO:2</code>.',
    noteAxis2:'<b>Eje 2 — nivel de uso.</b> Dice cuánto de <b>esa tarea</b> hizo la IA, no cuánto del artículo: si marca traducción y pone 3, declara que la mayor parte de lo traducido viene de la herramienta, y no dice nada del resto. 1 puntual (&lt;¼) · 2 parcial (¼–½) · 3 mayoritaria (½–¾) · 4 total (&gt;¾). Las proporciones son orientación, no umbrales. El botón <b>"omitir"</b> deja el nivel de uso <b>sin declarar</b>, que es una declaración válida y no un olvido. Es opcional, <b>a menos que</b> la revista o entidad que publica le pida que indique el nivel de uso. En ese caso debe indicarlo.',
    btnPng:'Descargar PNG', btnSvg:'Descargar SVG',

    tipExtentSub:(r,u)=>`${r} ${!u?'de la tarea marcada, no del artículo completo':(u.startsWith('el ')?'del '+u.slice(3):'de '+u)}. Es una orientación, no un límite exacto.`,
    tipStm:n=>`Actividad ${n} de STM (2025)`,
    tipStmSub:'STM es la asociación internacional de editoriales científicas cuya guía adopta este sistema. El número identifica la actividad en esa guía; las dos letras son solo su forma corta para la etiqueta.',
    tipCodeSub:'Las letras salen del término en inglés. El código es el mismo en cualquier idioma.',
    tipNoStm:'Ajeno a la clasificación de STM',
    tipNoStmSub:'N no describe una actividad: afirma que no hubo uso por encima del umbral (la actividad 1 de la guía internacional STM: corrección y estilo). Ver "Qué se declara y qué no" en el manual.',
    legendTitle:'Eje 2 · nivel de uso', legendNotDecl:'no declarada',
    lvOmit:'omitir', colExtent:'Nivel de uso', colOptional:'opcional',
    colExtentLead:'Actividades declarables',
    fontOk:kb=>`Tipografía: Inter incrustada (${kb} KB en el SVG). El archivo exportado se ve igual en cualquier máquina.`,
    fontFail:'Tipografía: sin red, se usa la del sistema. El diseño no se rompe, pero el SVG exportado dependerá de las fuentes de quien lo abra.',
    fontLoad:'Tipografía: cargando…',
    appName:'AIMLS',
    appDesc:'AI Manuscript Labelling System',
    navManual:'Manual', navAbout:'Acerca de', close:'Cerrar',
    manualToc:'Contenido',
    btnProse:'Prosa de la declaración', proseTitle:'Declaración en prosa — borrador',
    btnCopy:'Copiar', copied:'Copiado ✓', copyFail:'No se pudo copiar: selecciónelo a mano',
    proseNote:'Borrador para pegar en la sección de declaraciones del manuscrito. <b>Complete lo que va entre corchetes</b>: la prosa es lo que cuenta el caso concreto, y eso solo lo sabe quien declara. Se genera de las mismas opciones que la etiqueta, así que ambas dicen lo mismo.',
    legTools:'Herramientas y modelos (opcional)',
    btnAddTool:'+ Agregar herramienta',

/* ===================== AUTORÍA, LICENCIA, MANUAL ======================
   Los datos de autoría viven en un solo lugar. El manual y el «acerca de»
   se construyen desde el vocabulario real (TASKS, EXTENTS): si mañana
   cambia un código o una descripción, el manual cambia con él.
   ====================================================================== */
const APP = {
  version : '30',          // versión del SOFTWARE: cambia con cualquier retoque
  /* Versión de la NOTACIÓN, que es otra cosa y se mueve mucho menos: solo
     cambia si cambian los códigos, las reglas de composición o los ejes.
     Es la que se imprime en la etiqueta, porque es la que necesita quien la
     lea dentro de diez años para interpretarla. Si imprimiéramos la del
     software, dos artículos que declaran lo mismo llevarían números
     distintos por haber cambiado un botón, y eso rompe la comparabilidad. */
  notation: '1.0',
  /* Dirección canónica del sistema. NO es la del QR, que cada revista puede
     cambiar por la suya: esta es la que va en la prosa, para que quien lea
     el artículo sepa dónde está la notación. */
  home    : 'https://editorial-labs-cr.github.io/aimls/',
  /* Identificador de TODAS las versiones, que siempre resuelve a la más
     reciente. Se guarda solo este: el de cada versión concreta caducaría en
     el código con cada release, y el registro de Zenodo ya lo muestra. */
  doi     : '10.5281/zenodo.23139496',
  date    : {es:'4 de octubre de 2026', en:'4 October 2026', pt:'4 de outubro de 2026'},
  author  : 'Alexander Chinchilla Serrano',
  citeAuthor : 'Chinchilla Serrano, A.',
  orcid   : '0000-0001-9465-1522',
  email   : 'fchinchillas@uned.ac.cr',
  license : 'https://creativecommons.org/licenses/by/4.0/',   // contenido
  mit     : 'https://opensource.org/license/mit',               // código
  unit    : {es:'Unidad de Ciencia Abierta, Vicerrectoría de Investigación',
             en:'Open Science Unit, Office of the Vice-Rector for Research',
             pt:'Unidade de Ciência Aberta, Vice-Reitoria de Pesquisa'},
  univ    : 'Universidad Estatal a Distancia (UNED), Costa Rica',
  /* Colaboración, NO desarrollo ni autoría: quienes aportaron trabajo que no es
     código. Los nombres viven acá una sola vez y la frase que los rodea se
     traduce; así no pueden desincronizarse entre idiomas. En el preprint estas
     mismas personas figuran como coautoras, que es otra cosa y es correcto.
     NO van en CITATION.cff: el formato solo admite `authors`, y meterlos ahí
     los volvería coautores del software en cada cita generada. */
  collab  : [
    {name:'Carolina Seas Carvajal', orcid:'0000-0002-2102-1973', email:'cseas@uned.ac.cr'},
    {name:'Steven Segura Jiménez',  orcid:'0009-0005-6475-8798', email:'ssegura@uned.ac.cr'},

};

   El término inglés NO se sustituye por el local: es de donde sale la letra,
   y cambiarlo sugeriría que el código podría derivarse de cada idioma, que es
   justo lo contrario de lo que el sistema sostiene. */
const fromLabel = t => t.from + (lang==='en' || !t.gloss ? '' : ` (${t.gloss[lang]})`);

function footerHTML(){
  const sep = '<span class="sep">·</span>';
  return `<b>${esc(U.appName)}</b> ${w('version')} ${APP.version}${sep}`
    + `${w('devBy')} <b>${APP.author}</b>${sep}${orcidLink()}${sep}${mailLink()}<br>`
    + `${APP.unit[lang]}, ${APP.univ}<br>`
    + `${w('openSrc')}: `
    + `<span class="lic">MIT</span> ${mitLink(w('code'))} `
    + `<span class="lic">CC BY 4.0</span> ${licLink(w('content'))}${sep}`
    + `<button type="button" data-open="dlgManual">${U.navManual}</button>${sep}`
    + `<button type="button" data-open="dlgAbout">${U.navAbout}</button>`;
}

function codesTable(){
  const rows = TASKS.map(t=>{
    const code = t.code ? `<code>${t.code}</code>` : '—';
    const stm  = t.stm ?? '—';
    // la actividad 9 lleva la marca en ambos idiomas (en español venía dentro del texto)
    const desc = (t.declarable===false
      ? `<b>${U.tagNotDecl}.</b> ${esc(t[lang].replace(/^No declarable\.\s*/,''))}`
      : (t.tag ? `<b>${esc(U[t.tag])}.</b> ${esc(t[lang])}` : esc(t[lang])))
      + (t.eg ? `<br><small>${esc(t.eg[lang])}</small>` : '')
      + (t.scopeNote ? `<br><small>${esc(t.scopeNote[lang])}</small>` : '');
    return `<tr><td>${code}</td><td>${t.from ? `<i>${esc(fromLabel(t))}</i>` : '—'}</td><td>${stm}</td><td>${desc}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>${w('thCode')}</th><th>${w('thFrom')}</th><th>STM</th><th>${w('thDesc')}</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function extentTable(){

<p class="warn"><b>Cuidado con no confundirlo con el Eje 2.</b> Que el nivel de uso sea opcional no vuelve opcional la tarea: <code>AI: TR</code> sin número es una declaración válida, pero <b>callar</b> que se tradujo no lo es.</p>
<p>El umbral no lo inventa este sistema: las guías de STM de 2023 recomiendan que la actividad 1 no requiera declaración, y una revisión de políticas de once editoriales de gran escala encuentra lo mismo: los usos asistivos menores de gramática y estilo típicamente no se declaran, y los sustantivos sí.</p>
<p><b>Si la revista o entidad que publica pide más, manda esa política.</b> Puede situar su umbral más abajo y exigir que se declare también la actividad 1; para eso el código <code>ED</code> está disponible, y también lo usa quien quiera declararla por voluntad propia.</p>
<h3>8. Preguntas frecuentes</h3>
<p><b>¿AIMLS detecta si un texto fue escrito por una IA?</b> No. AIMLS no analiza el manuscrito ni estima nada: solo convierte en etiqueta lo que usted declara. Es un sistema de declaración, no de detección.</p>
<p><b>¿Sirve para una tesis o un informe, o solo para artículos de revista?</b> Sirve para cualquier manuscrito. El vocabulario describe la preparación de un documento que se somete a publicación o evaluación, y eso incluye tesis, informes y capítulos de libro.</p>
<p><b>¿Cómo escojo el nivel de uso?</b> Es una estimación suya, no una medición, y es opcional, a menos que la revista o entidad que publica se lo pida: puede marcar la tarea y pulsar <b>"omitir"</b>. Si lo declara, la pregunta es cuánto de <b>esa tarea</b> hizo la herramienta, no cuánto del artículo. Si la herramienta tradujo el texto entero, es 4, aunque traducir sea una parte pequeña de todo su trabajo. Si tradujo usted y la herramienta solo revisó parte, es menos. Las proporciones son orientación: nadie espera que cuente palabras.</p>
<p><b>¿Y si usé IA para las fórmulas matemáticas?</b> Depende de qué hizo la herramienta. Si redactó el contenido matemático que aparece en el texto, es la actividad 2. Si solo lo maquetó (pasarlo a LaTeX, por ejemplo), es la actividad 1 y está en el umbral. Si hizo la matemática (resolver, demostrar, derivar), eso es parte del proceso de investigación y queda fuera de este sistema: declárelo en prosa si se lo piden.</p>
<p><b>¿Por qué hay dos selectores de idioma?</b> Porque son dos cosas distintas. El de arriba, "Idioma de la pantalla", cambia lo que usted ve mientras trabaja: es para quien opera. El de abajo, "Idioma de la etiqueta y la prosa", es el idioma del artículo, y es el que se imprime. Una persona editora puede trabajar en español y producir una etiqueta en inglés para un artículo en inglés. Los códigos no dependen de ninguno de los dos.</p>
<p><b>¿La etiqueta reemplaza la declaración escrita?</b> No. La acompaña.</p>
<p><b>¿Y la verificación humana?</b> No es un nivel de la escala: se entiende que quien declara revisó todo lo incorporado y asume la responsabilidad del contenido.</p>
<p><b>¿Por qué no se puede marcar la actividad 9?</b> Presentar contenido generado por IA como si fuera un dato original de fuentes no maquinales no se declara: las guías de STM recomiendan prohibirlo.</p>
<p><b>¿Hay que declarar el corrector ortográfico?</b> No necesariamente. STM recomienda que la actividad 1 no requiera declaración; el código ED queda disponible para quien quiera declararla o para revistas con un umbral más exigente.</p>`;

/* Bloque de colaboración: una línea que dice QUÉ se hizo y, debajo, cada

   aparte y no en una sola frase porque con identificador y correo la frase
   se vuelve ilegible, y porque así cada quien puede señalar su propia línea. */
function collabBlock(l){
  const T = {
    es:{lead:'Colaboración',
        roles:'revisión de textos, revisión del inglés, pruebas de uso y sugerencias de interfaz'},
    en:{lead:'Collaboration',
        roles:'text revision, English-language review, user testing and interface suggestions'},
    pt:{lead:'Colaboração',
        roles:'revisão de textos, revisão do inglês, testes de uso e sugestões de interface'},
  }[l] || {};
  const gente = APP.collab.map(c =>
    `<p class="person"><b>${esc(c.name)}</b><br>${orcidLink(c.orcid)} · ${mailLink(c.email)}</p>`
  ).join('');
  /* La afiliación va DEBAJO de las personas y no en la línea de entrada, con
     la misma forma que en el bloque de autoría: son de la misma unidad, y
     ponerla arriba la separaba de a quién pertenece. */
  const casa = `<p class="affil">${APP.unit[l] || APP.unit.es}<br>${APP.univ}</p>`;
  return `<p><b>${T.lead}:</b> ${T.roles[0].toUpperCase()+T.roles.slice(1)}.</p>${gente}${casa}`;
}

let U = UI.en;   // por defecto inglés; el arranque lo re-lee del selector

function applyLang(){
  /* Red de seguridad: si `lang` no es uno de los idiomas que existen, se cae
     al inglés en vez de reventar. Hoy no es alcanzable (el valor solo sale
     del selector), pero el día que LANGS cambie o un navegador restaure un
     valor viejo de formulario, la app sigue en pie en vez de quedar en
     blanco. Cuesta una línea. */
  if(!UI[lang]) lang = 'en';
  U = UI[lang];
  document.documentElement.lang = lang;
  document.title = U.docTitle;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = U[el.getAttribute('data-i18n')];
    if(v !== undefined) el.innerHTML = v;
  });
  /* Guías flotantes cuyo texto también se traduce. Van como atributo, no como
     contenido, así que no las alcanza el bucle de arriba. */
  document.querySelectorAll('[data-i18n-tip]').forEach(el=>{
    el.setAttribute('data-tip', U[el.getAttribute('data-i18n-tip')] || '');
    const sub = el.getAttribute('data-i18n-tipsub');
    if(sub) el.setAttribute('data-tip-sub', U[sub] || '');
  });
  $('foot').innerHTML = footerHTML();
  $('manualBody').innerHTML = manualHTML();
  indiceManual();
  $('aboutBody').innerHTML = aboutHTML();
  if(fontState.kind) $('fontNote').textContent =
    fontState.kind==='ok' ? U.fontOk(fontState.kb) : U.fontFail;
  else $('fontNote').textContent = U.fontLoad;
}


/* --- Índice del manual ----------------------------------------------------
   Se arma leyendo los <h3> que el manual ya trae, no de una lista aparte:
   si mañana se agrega, se quita o se renombra una sección, el índice cambia
   con ella y no hay forma de que quede desfasado. Funciona igual en los tres
   idiomas sin traducir nada más que la palabra «Contenido».
   El salto no usa href="#id" porque el manual vive dentro de un <dialog> con
   su propio contenedor con barra de desplazamiento: un ancla movería la
   página de atrás, no el diálogo. Se mueve el scrollTop del contenedor. */
function indiceManual(){
  const cuerpo = $('manualBody');
  const hs = [...cuerpo.querySelectorAll('h3')];
  if(hs.length < 2) return;
  const items = hs.map((h,i)=>{
    const id = 'man-s' + i; h.id = id;
    return `<li><button type="button" class="tocgo" data-goto="${id}">${esc(h.textContent)}</button></li>`;
  }).join('');
  const nav = document.createElement('nav');
  nav.className = 'toc';
  nav.setAttribute('aria-label', U.manualToc);
  nav.innerHTML = `<p class="toc-t">${esc(U.manualToc)}</p><ul>${items}</ul>`;
  // Va después del <h2> y del párrafo de entrada, antes de la primera sección.
  cuerpo.insertBefore(nav, hs[0]);
  nav.addEventListener('click', ev=>{
    const b = ev.target.closest('.tocgo'); if(!b) return;
    const destino = cuerpo.querySelector('#' + b.dataset.goto);
    const caja = cuerpo.closest('.dlg-in');
    if(!destino || !caja) return;
    caja.scrollTop = destino.offsetTop - caja.offsetTop - 8;
    destino.setAttribute('tabindex','-1'); destino.focus({preventScroll:true});
  });
}

/* INVARIANTE en todos los idiomas. Esto es el CÓDIGO de la etiqueta: lo que
   se compara, se agrega y se busca entre revistas de cualquier país. Si se
   tradujera, dos revistas que declaran lo mismo producirían cadenas distintas
   y la etiqueta perdería su única razón de ser. */
const BADGE = {
  prefix  : 'AI: ',
  sep     : '+',
  toolsSep: ' · ',          // no «+»: ese signo ya separa códigos
  system  : 'AIMLS',        // invariante, como el código
};

/* TRADUCIBLE. Esto son DESCRIPCIONES, no código: dicen en lengua natural qué
   es la etiqueta. Siguen al idioma de la ETIQUETA (docLang), no al de la
   interfaz, porque se imprimen dentro del artículo.
   «declaration» sustituye a «Standard Declaration»: dice qué ES la etiqueta
   respecto de la declaración que ya pide la revista — la complementa, no la
   reemplaza. */
const BADGE_L = {
  es:{ declaration:'Complementa la declaración en prosa del texto',
       kind:'Declaración de uso de IA',
       toolsLead:'Herramientas: ', moreInfo:'Más información',
       noUse:'SIN USO POR ENCIMA DEL UMBRAL', noExtent:'NIVEL DE USO NO DECLARADO' },
  en:{ declaration:'Complements the prose declaration in the text',
       kind:'AI use declaration',
       toolsLead:'Tools: ', moreInfo:'More info',
       noUse:'NO USE ABOVE THRESHOLD', noExtent:'LEVEL OF USE NOT DECLARED' },
  pt:{ declaration:'Complementa a declaração em prosa do texto',
       kind:'Declaração de uso de IA',
       toolsLead:'Ferramentas: ', moreInfo:'Mais informações',
       noUse:'SEM USO ACIMA DO LIMIAR', noExtent:'NÍVEL DE USO NÃO DECLARADO' },
};
/* El motor de composición solo conoce `T`: se recompone al cambiar docLang. */
let T = Object.assign({}, BADGE, BADGE_L.en);
function applyDocLang(){ T = Object.assign({}, BADGE, BADGE_L[docLang]); }

/* --- Tokens de diseño --------------------------------------------------
   Todo en unidades SVG. 1 unidad = 1 px a 1×. La columna izquierda la ocupa
   la marca completa (nombre, icono y descriptor), y es ella la que fija el
   alto interno de la tarjeta cuando el contenido no da más.
   ---------------------------------------------------------------------- */
const D = {
  outPad:11, rOut:28, rCard:18,          // marco negro y radios
  cardPadX:20, cardPadY:16,
  icon:112, iconGap:22,
  titleSize:68, titleWeight:700, titleLS:-1.5, titleMin:30,
  detailsSize:21, detailsWeight:500,
  /* El aviso de nivel no declarado va un punto más pequeño que la cadena
     canónica: es una nota sobre lo que falta, no el dato en sí, y con la
     redacción larga pesaba demasiado en la etiqueta. Se DIBUJA más pequeño
     pero se MIDE al tamaño normal: la altura de la etiqueta sale de una
     cadena de referencia a detailsSize, y medirla más pequeña rompería el
     alto constante que iguala, para un mismo contenido, todas las etiquetas
     en los tres idiomas. Cabe de sobra en el espacio ya reservado. */
  noExtentSize:18,
  /* Marca apilada: nombre sobre el icono, descriptor debajo. Los cuerpos
     salen de medir qué se lee a tamaño real: por debajo de 13 el
     descriptor se empasta en una etiqueta impresa a 70 mm. */
  sysNameSize:21, sysNameGap:7, sysDescSize:13, sysDescWeight:600, sysDescGap:5,
  declSize:17, declWeight:500, declLS:0.1,   // la frase es más larga que «Standard Declaration»: baja de cuerpo
  toolsSize:15, toolsWeight:400,
  gapDetailsTools:7, toolsLineGap:4, toolsMinW:300,
  toolsMax:6, toolNameMax:30, toolModelMax:30,   // topes: la etiqueta es un distintivo, no un inventario
  miSize:23, miWeight:600,               // "More info"
  ruleW:3, dotR:6.5,
  gapDetailsBlock:12, gapTitleRule:14, gapRuleDecl:11,
  qrPad:18, qrGap:11, qrSafePad:9,       // qrSafePad = placa blanca alrededor del QR
  ax3BandH:26, ax3StripW:36, ax3Gap:10,
  maxCardW:1500,                          // antes de encoger el título
  fg:'#101114', bg:'#ffffff',
};

const FONT_FAMILY = "'Etiqueta Inter','Inter','Helvetica Neue',Helvetica,Arial,sans-serif";

/* =========================== 1. ESTADO ================================= */
let state = {};                 // code -> extensión 0..4 (0 = no declarada). La clave existe = tarea marcada
let fonts = {ready:false, faces:[]};
let fontState = {kind:null, kb:0};
/* Herramientas y modelos: opcional y múltiple. Filas vacías se ignoran. */
/* Sugerencias para el campo de herramienta. Son nombres propios: NO se
   traducen, igual que los códigos de la etiqueta. Van agrupadas por tarea y
   no alfabéticamente, porque quien abre la lista sin escribir la recorre
   mejor así; en cuanto escribe, el navegador filtra y el orden da igual.

   NO es una lista aprobada ni exhaustiva, y el manual lo dice con todas las
   letras. Se usa `datalist`, no `select`: sugiere sin cerrar la puerta, así
   que cualquier otra herramienta se escribe a mano y vale igual. Una lista
   cerrada habría dejado fuera a quien use algo que no esté acá.

   Envejece: este archivo se descarga y se aloja, y quien se lleve una copia
   congela la lista de ese día. Es el precio de que el dato sea comparable,
   y por eso son sugerencias y no una imposición. */
const TOOL_SUGGESTIONS = [
  // escritura, edición y código. «Copilot» a secas era ambiguo: hay dos
  // productos distintos con ese nombre, uno para escribir en Office y otro
  // para código, y declarar «Copilot» no decía cuál. Microsoft va primero
  // por ser el de uso más extendido entre quienes escriben manuscritos.
  'ChatGPT', 'Claude', 'Gemini', 'Microsoft Copilot', 'GitHub Copilot', 'DeepSeek',
  'DeepL', 'Google Translate',                                  // traducción
  'Grammarly', 'QuillBot', 'Paperpal', 'Writefull', 'Trinka',   // edición de lenguaje
  'Perplexity', 'Elicit', 'Consensus', 'SciSpace', 'NotebookLM',// búsqueda de referencias
  'Midjourney', 'DALL·E', 'Stable Diffusion',                   // imágenes y figuras
  /* Las actividades 4 (formato de datos) y 6 (visualizaciones) no llevan
     sugerencia propia a propósito: no hay ahí una herramienta dominante como
     DeepL lo es en traducción, y esas tareas se hacen con los asistentes
     generales que ya están arriba. Añadir un producto de nicho para tapar el
     hueco le daría prominencia a algo que casi nadie usa.
     Tampoco va nada de DETECCIÓN, tipo Turnitin: no se prepara un manuscrito
     con eso, se revisa, y son dos cosas que el sistema separa a propósito. */
];

let toolRows = [{name:'', model:''}];
const clean = v => String(v||'').replace(/\s+/g,' ').trim();
function toolItems(){
  return toolRows.map(r=>({n:clean(r.name), m:clean(r.model)}))
                 .filter(r=>r.n)
                 .map(r=> r.m ? `${r.n} (${r.m})` : r.n);
}   // para volver a rotular el aviso al cambiar de idioma
/* Idiomas PRESENTES en los diccionarios frente a idiomas OFRECIDOS en la
   interfaz. El portugués está traducido y probado, pero no se ofrece: las
   descripciones de STM en portugués son traducción propia, sin fuente
   autorizada, y no se han revisado con alguien nativo (aplazado por el
   usuario el 2026-09-23). Se reactiva metiendo 'pt' en LANGS — nada más.
   Se mantiene dentro de LANG_ALL a propósito, para que las pruebas de
   completitud lo sigan cubriendo y la traducción no se pudra mientras
   espera revisión. */
const LANG_ALL  = ['es','en','pt'];
const LANGS     = ['es','en'];
const LANGNAME  = {es:'Español', en:'English', pt:'Português'};

/* DOS EJES DE IDIOMA, deliberadamente separados (decidido 2026-09-23):
   · lang    — idioma de la INTERFAZ: para quien opera la herramienta.
   · docLang — idioma de la ETIQUETA (el del artículo): gobierna a la vez las descripciones de
               la etiqueta y la prosa, porque las dos cosas entran al mismo
               artículo y no pueden ir en lenguas distintas.
   Lo que NO depende de ninguno de los dos son los códigos (`AI: `, `+`, ED,
   TG, TR…): son invariantes en inglés por diseño, porque son lo que se
   compara y se agrega entre revistas de cualquier país. */
let lang    = 'en';
let docLang = 'en';

/* =========================== 2. STRINGS ================================
   Una sola función produce las dos cadenas, del mismo acto declarativo —
   que es el principio de diseño del §3 del preprint: la prosa, la etiqueta
   y los metadatos salen de una sola captura, para que no puedan divergir.
   ====================================================================== */
function selectedCodes(){ return ORDER.filter(c => c in state); }   // ya en orden STM

/* ======================== PROSA DE LA DECLARACIÓN =======================
   La segunda de las tres salidas del §5 del preprint. Sale del MISMO estado
   que la etiqueta (una sola captura, §3): etiqueta y prosa no pueden
   contradecirse porque no hay dos fuentes.

   Es un BORRADOR a propósito. La prosa vale por lo que cuenta del caso
   concreto —qué se hizo y en qué secciones— y eso solo lo sabe quien
   declara. Esos huecos se marcan entre corchetes en vez de rellenarse con
   algo genérico que invite a pegarlo tal cual.

   Devuelve segmentos {t, ph}: ph = marcador que el autor debe completar.
   ====================================================================== */
const PROSE = {
  es:{
    none   : 'Las personas autoras declaran que en la preparación de este manuscrito no se utilizaron herramientas de inteligencia artificial por encima del umbral declarable, es decir, más allá de la corrección ortográfica, gramatical o de estilo.',
    lead1  : 'En la preparación de este manuscrito se utilizaron herramientas de inteligencia artificial para la siguiente tarea: ',
    leadN  : 'En la preparación de este manuscrito se utilizaron herramientas de inteligencia artificial para las siguientes tareas: ',
    extent : lv => `nivel de uso: ${lv}`,
    tools  : 'Herramientas utilizadas: ',
    toolPh : '[Indique la herramienta y su versión, p. ej. ChatGPT (GPT-5).]',
    whatPh : '[Describa brevemente qué se hizo con cada herramienta y en qué secciones del manuscrito.]',
    verify : 'Todo el contenido generado o modificado con estas herramientas fue revisado por las personas autoras, quienes verificaron su pertinencia y veracidad y asumen la responsabilidad plena por el contenido final.',
    label  : 'Etiqueta de declaración: ',
    built  : (v,u) => `Las personas autoras elaboraron esta declaración con AIMLS ${v} (AI Manuscript Labelling System), disponible en ${u}`,
  },
  en:{
    none   : 'The authors declare that no artificial intelligence tools were used in the preparation of this manuscript above the disclosable threshold, that is, beyond spelling, grammar or style correction.',
    lead1  : 'Artificial intelligence tools were used in the preparation of this manuscript for the following task: ',
    leadN  : 'Artificial intelligence tools were used in the preparation of this manuscript for the following tasks: ',
    extent : lv => `level of use: ${lv}`,
    tools  : 'Tools used: ',
    toolPh : '[State the tool and its version, e.g. ChatGPT (GPT-5).]',
    whatPh : '[Briefly describe what was done with each tool and in which sections of the manuscript.]',
    verify : 'All content generated or modified with these tools was reviewed by the authors, who verified its relevance and accuracy and take full responsibility for the final content.',
    label  : 'Declaration label: ',
    built  : (v,u) => `The authors prepared this declaration with AIMLS ${v} (AI Manuscript Labelling System), available at ${u}`,
  },
  pt:{
    none   : 'Os autores declaram que na preparação deste manuscrito não foram utilizadas ferramentas de inteligência artificial acima do limiar declarável, isto é, além da correção ortográfica, gramatical ou de estilo.',
    lead1  : 'Na preparação deste manuscrito foram utilizadas ferramentas de inteligência artificial para a seguinte tarefa: ',
    leadN  : 'Na preparação deste manuscrito foram utilizadas ferramentas de inteligência artificial para as seguintes tarefas: ',
    extent : lv => `nível de uso: ${lv}`,
    tools  : 'Ferramentas utilizadas: ',
    toolPh : '[Indique a ferramenta e sua versão, p. ex. ChatGPT (GPT-5).]',
    whatPh : '[Descreva brevemente o que foi feito com cada ferramenta e em quais seções do manuscrito.]',
    verify : 'Todo o conteúdo gerado ou modificado com estas ferramentas foi revisado pelos autores, que verificaram sua pertinência e veracidade e assumem a responsabilidade plena pelo conteúdo final.',
    label  : 'Etiqueta de declaração: ',
    built  : (v,u) => `Os autores elaboraram esta declaração com AIMLS ${v} (AI Manuscript Labelling System), disponível em ${u}`,
  },
};
const lcFirst = t => t.charAt(0).toLowerCase() + t.slice(1);

/* «A y B», «A, B y C» — y «e» ante palabra que empieza por el sonido /i/
   (ChatGPT e Illustrator). En inglés, coma serial (APA): «A, B, and C».
   En portugués, «e» sin alternancia y SIN coma serial: «A, B e C». */
function joinList(arr, pl){
  if(arr.length < 2) return arr.join('');
  const last = arr[arr.length-1], rest = arr.slice(0,-1);
  if(pl==='en') return arr.length===2 ? `${rest[0]} and ${last}` : `${rest.join(', ')}, and ${last}`;
  if(pl==='pt') return `${rest.join(', ')} e ${last}`;
  const y = /^h?i(?![aeouáéóú])/i.test(last) ? 'e' : 'y';
  return `${rest.join(', ')} ${y} ${last}`;
}

function proseSegments(pl){
  const P = PROSE[pl];
  const s = badgeStrings();
  if(!s) return [];
  if(state.N) return [{t:P.none}, {t:' '+P.label + s.canonical + '.'},
                      {t:' ' + P.built(APP.notation, APP.home) + '.'}];

  /* Las tareas llevan comas internas («refinamiento, corrección, edición o
     formato…»): separarlas con comas las haría ilegibles. Con más de una se
     enumeran (a), (b)… y se separan con punto y coma. */
  const items = s.codes.map(c=>{
    const t = TASKS.find(x=>x.code===c);
    const lv = state[c] || 0;
    const ext = lv ? ` (${P.extent(EXTENTS[lv][pl].split(':')[0].toLowerCase())})` : '';
    return lcFirst(t[pl]) + ext;
  });
  const tareas = items.length===1
    ? P.lead1 + items[0] + '.'
    : P.leadN + items.map((x,i)=>`(${String.fromCharCode(97+i)}) ${x}`).join('; ') + '.';

  const seg = [{t:tareas}, {t:' '}];
  if(s.tools.length) seg.push({t:P.tools + joinList(s.tools, pl) + '.'});
  else               seg.push({t:P.toolPh, ph:true});
  seg.push({t:' '}, {t:P.whatPh, ph:true}, {t:' '}, {t:P.verify}, {t:' '+P.label + s.canonical + '.'},
           {t:' ' + P.built(APP.notation, APP.home) + '.'});
  return seg;
}
const proseText = pl => proseSegments(pl).map(x=>x.t).join('');
const proseHTML = pl => proseSegments(pl).map(x=> x.ph ? `<mark class="ph">${esc(x.t)}</mark>` : esc(x.t)).join('');

function badgeStrings(){
  const P = BADGE.prefix, S = BADGE.sep;
  if(state.N) return {title:P+'N', details:T.noUse, canonical:P+'N', codes:['N'], tools:[]};
  const codes = selectedCodes();
  if(!codes.length) return null;

  // Título: prefijo una vez + códigos unidos por «+».      AI: ED+TR+CO
  const title = P + codes.join(S);

  // Cadena canónica: lo mismo, con la extensión pegada al código que la
  // declaró. La extensión se OMITE cuando no se declara (§4.2).
  const canonical = P + codes.map(c => c + (state[c] ? ':' + state[c] : '')).join(S);

  // La línea de detalle solo aporta si hay alguna extensión; si no, lo dice.
  // Hacer visible la ausencia de dato es el mismo argumento del §4.5 sobre N.
  const anyExtent = codes.some(c => state[c] > 0);
  return {title, details: anyExtent ? canonical : T.noExtent, noExtent: !anyExtent, canonical, codes, tools: toolItems()};
}

/* =========================== MEDICIÓN ==================================
   Dos instrumentos, porque miden cosas distintas:

   · ANCHO  -> getBBox() sobre un <text> SVG real. Es la única medida que
     coincide con lo que el navegador va a dibujar en el SVG exportado
     (incluye letter-spacing y el avance del último glifo).
   · ALTO   -> canvas.measureText().actualBoundingBox*, que sí da la TINTA
     real. getBBox() de texto en Chrome devuelve la caja de la fuente
     (ascender+descender del em), no la tinta: como acá todo es
     versalita/dígito, eso metía ~30 unidades de aire fantasma arriba y
     abajo y dejaba la etiqueta rechoncha frente al mockup.

   Además el alto se mide contra CADENAS DE REFERENCIA fijas, no contra el
   texto real. Eso hace que TODAS las etiquetas del sistema tengan el mismo
   alto: AI:N y AI:TR-ED-BI-DA-CO-GE-IM se alinean en una misma línea de
   una página. Solo varía el ancho.
   ====================================================================== */
const measSvg = document.createElementNS(NS,'svg');
measSvg.setAttribute('width','10'); measSvg.setAttribute('height','10');
Object.assign(measSvg.style,{position:'absolute',left:'-10000px',top:'0',overflow:'hidden'});
const measText = document.createElementNS(NS,'text');
measSvg.appendChild(measText);
document.body.appendChild(measSvg);
const measCtx = document.createElement('canvas').getContext('2d');

/* Cadenas de referencia: mismo perfil de tinta que cualquier valor real. */
/* Extremos verticales que puede traer CUALQUIER idioma latino: mayúscula
   acentuada (Á y Õ suben por encima de la altura de caja), ascendentes,
   descendentes, dígitos y paréntesis. No es texto visible: es un patrón. */
const INK = 'ÁÕ1bdfhkl(gjpqy)';

/* Referencia métrica — NO es el texto real.
   La altura de cada franja se reserva midiendo ESTA cadena y no lo que va a
   imprimirse, para que todas las etiquetas midan lo mismo y se alineen en la
   página. Ahora que las descripciones se traducen, la referencia TIENE que
   ser independiente del idioma: si midiera el texto real, una etiqueta en
   portugués y una en inglés dejarían de tener la misma altura, y una revista
   que publica en dos lenguas las vería descuadradas uña junto a otra.
   Antes esto medía las cadenas inglesas fijas, que no llevaban acentos; con
   «EXTENSIÓN NO DECLARADA» o «Mais informações» eso se habría quedado corto
   por arriba. El título es la excepción: solo lleva códigos ASCII, así que se
   mide con su forma real. */
const REF = {
  title  : 'AI: N+',                    // versalitas, dos puntos, signo más
  details: INK,
  decl   : INK,
  tools  : INK,
  mi     : INK,
};

function widthOf(str, size, weight, ls){
  measText.setAttribute('font-family', FONT_FAMILY);
  measText.setAttribute('font-size', size);
  measText.setAttribute('font-weight', weight);
  measText.setAttribute('letter-spacing', ls||0);
  measText.textContent = str;
  return measText.getBBox().width;
}

function inkOf(refStr, size, weight){
  measCtx.font = weight + ' ' + size + 'px ' + FONT_FAMILY;
  const m = measCtx.measureText(refStr);
  const a = m.actualBoundingBoxAscent, d = m.actualBoundingBoxDescent;
  if(typeof a !== 'number' || !isFinite(a))          // navegador sin soporte
    return {ascent:size*0.72, descent:size*0.02, h:size*0.74};
  return {ascent:a, descent:Math.max(0,d), h:a+Math.max(0,d)};
}

/* =========================== 3. LAYOUT =================================
   Devuelve un objeto geométrico puro. Reglas:
   · El ancho lo manda el contenido, nunca al revés  -> no hay traslape.
   · El alto lo manda el ícono o la columna de texto, lo que sea mayor.
   · El bloque del QR se dimensiona DESPUÉS, a partir del alto ya resuelto,
     y su ancho es max(QR, "More info") + padding -> se ajusta al contenido.
   ====================================================================== */
/* Reparte la lista en renglones que caben en `maxW`, sin partir nunca una
   herramienta. Dos pasos:
   1. el reparto codicioso fija CUÁNTOS renglones hacen falta;
   2. entre todos los repartos con ese número de renglones se elige el que
      minimiza el renglón más largo. Así 6 herramientas quedan 2-2-2 y no
      2-3-1 con una huérfana al final. Con ≤6 elementos hay como mucho 10
      combinaciones: la búsqueda exhaustiva es instantánea. */
function packTools(items, maxW){
  if(!items.length) return [];
  const W = t => widthOf(t, D.toolsSize, D.toolsWeight, 0);
  const text = (grupo, primero) => (primero ? T.toolsLead : '') + grupo.join(BADGE.toolsSep);

  let n = 1, cur = [];
  items.forEach(it=>{
    const cand = [...cur, it];
    if(cur.length && W(text(cand, n===1)) > maxW){ n++; cur = [it]; }
    else cur = cand;
  });

  let best = null;
  const probar = grupos => {
    const lines = grupos.map((g,i)=>{ const t = text(g, i===0); return {t, w:W(t)}; });
    const peor = Math.max(...lines.map(l=>l.w));
    if(!best || peor < best.peor) best = {peor, lines};
  };
  const recorrer = (desde, quedan, acc) => {
    if(quedan===1){ probar([...acc, items.slice(desde)]); return; }
    for(let hasta = desde+1; hasta <= items.length-(quedan-1); hasta++)
      recorrer(hasta, quedan-1, [...acc, items.slice(desde, hasta)]);
  };
  recorrer(0, n, []);
  return best.lines;
}

function computeLayout(s, opts){
  const ax3 = (opts && opts.ax3) || 'none';
  const qrSafe = !opts || opts.qrSafe !== false;

  // alturas de tinta: contra referencias fijas -> alto constante del sistema
  const vDetails = inkOf(REF.details, D.detailsSize, D.detailsWeight);
  const vDecl    = inkOf(REF.decl,    D.declSize,    D.declWeight);
  const vMi      = inkOf(REF.mi,      D.miSize,      D.miWeight);

  const wDetails = widthOf(s.details, D.detailsSize, D.detailsWeight, 0);
  const wDecl    = widthOf(T.declaration, D.declSize, D.declWeight, D.declLS);
  const wMi      = widthOf(T.moreInfo, D.miSize, D.miWeight, 0);

  // -- título: encoge de a 2 pt si la cápsula se pasa de maxCardW ----------
  let titleSize = D.titleSize, wTitle, vTitle, colW, colLeft, colRight, shrunk = false;
  for(;;){
    wTitle = widthOf(s.title, titleSize, D.titleWeight, D.titleLS);
    vTitle = inkOf(REF.title, titleSize, D.titleWeight);
    colLeft  = Math.min(-D.dotR, wTitle/2 - wDecl/2);
    colRight = Math.max(wTitle + D.dotR, wTitle/2 + wDecl/2);
    if(wDetails > colRight - colLeft) colRight = colLeft + wDetails;  // DETAILS ensancha si hace falta
    colW = colRight - colLeft;
    if(D.cardPadX*2 + D.icon + D.iconGap + colW <= D.maxCardW || titleSize <= D.titleMin) break;
    titleSize -= 2; shrunk = true;
  }

  // -- alturas ------------------------------------------------------------
  // herramientas: renglones del ancho de la columna (con un mínimo, para que
  // una etiqueta de título corto no parta la lista en tiras)
  const toolLines = packTools(s.tools || [], Math.max(colW, D.toolsMinW));
  const wTools = toolLines.reduce((m,l)=>Math.max(m,l.w), 0);
  if(wTools > colW){ colRight = colLeft + wTools; colW = wTools; }
  const vTools = inkOf(REF.tools, D.toolsSize, D.toolsWeight);
  const toolsH = toolLines.length
    ? D.gapDetailsTools + toolLines.length*vTools.h + (toolLines.length-1)*D.toolsLineGap : 0;

  const blockH = vTitle.h + D.gapTitleRule + D.ruleW + D.gapRuleDecl + vDecl.h;
  const bandH  = (ax3==='band') ? D.ax3BandH + D.ax3Gap : 0;
  const contentH = vDetails.h + toolsH + D.gapDetailsBlock + blockH + bandH;

  /* LA MARCA MIDE LA COLUMNA IZQUIERDA, no el icono suelto. La marca es
     nombre + icono + descriptor, y es más alta que el icono. Midiendo por el
     icono, el descriptor se salía 7,6 u por debajo de la tarjeta en las
     etiquetas cortas (N, o una tarea sin herramientas), donde la columna de
     contenido no aporta altura de sobra. Con la tarjeta alta no se veía: por
     eso hay que probar las dos. */
  const sysName = T.system + ' ' + APP.notation;
  const sysDesc = T.kind;

  // el nombre no se sacrifica nunca: se encoge hasta caber sobre el icono
  let sysNameSize = D.sysNameSize;
  while(sysNameSize > 11 && widthOf(sysName, sysNameSize, 700, 0.05) > D.icon + 6) sysNameSize -= 0.5;

  /* El descriptor se parte midiendo, no con una tabla por idioma: en español
     y portugués pasa de 120 u y bajo el icono solo caben 105, mientras que en
     inglés cabría de una. Así sigue funcionando si el texto cambia. */
  function envolverDesc(txt, size){
    const palabras = String(txt).split(/\s+/), lineas = [];
    let act = '';
    for(const p of palabras){
      const prueba = act ? act + ' ' + p : p;
      if(act && widthOf(prueba, size, D.sysDescWeight, 0.2) > D.icon + 4){ lineas.push(act); act = p; }
      else act = prueba;
    }
    if(act) lineas.push(act);
    return lineas;
  }
  let sysDescSize = D.sysDescSize, sysDescLines = envolverDesc(sysDesc, sysDescSize);
  while(sysDescLines.length > 2 && sysDescSize > 9){
    sysDescSize -= 0.5; sysDescLines = envolverDesc(sysDesc, sysDescSize);
  }
  const sysDescLead = sysDescSize * 1.04;
  const sysNameH   = sysNameSize * 1.02;
  const sysDescH   = (sysDescLines.length - 1) * sysDescLead + sysDescSize * 1.02;
  const markH      = sysNameH + D.sysNameGap + D.icon + D.sysDescGap + sysDescH;

  const cardInnerH = Math.max(markH, contentH);
  const cardH = cardInnerH + D.cardPadY*2;
  const H = cardH + D.outPad*2;

  // -- anchos -------------------------------------------------------------
  const cardX = D.outPad, cardY = D.outPad;
  const cardW = D.cardPadX*2 + D.icon + D.iconGap + colW;

  // -- bloque QR: se dimensiona con el alto ya resuelto --------------------
  const qrOuter = Math.max(40, H - D.qrPad*2 - vMi.h - D.qrGap);
  const qrRegionW = Math.max(qrOuter, wMi) + D.qrPad*2;

  const stripW = (ax3==='strip') ? D.ax3StripW : 0;
  const W = cardX + cardW + stripW + qrRegionW;

  // -- posiciones ---------------------------------------------------------
  const innerX = cardX + D.cardPadX;
  const innerY = cardY + D.cardPadY;
  const iconX = innerX;
  /* Se centra la MARCA como unidad y el icono cuelga dentro; centrando el
     icono, el nombre y el descriptor quedarían descolgados. */
  const markTop     = innerY + (cardInnerH - markH)/2;
  const sysNameBase = markTop + sysNameSize * 0.78;
  const iconY       = markTop + sysNameH + D.sysNameGap;
  const sysDescBase = iconY + D.icon + D.sysDescGap + sysDescSize * 0.78;
  const sysCx       = iconX + D.icon/2;
  const titleX = innerX + D.icon + D.iconGap - colLeft;

  const detailsBaseline = innerY + vDetails.ascent;
  const detailsEndX = cardX + cardW - D.cardPadX;


  const toolsBaselines = toolLines.map((l,i)=> innerY + vDetails.h + D.gapDetailsTools
                                          + vTools.ascent + i*(vTools.h + D.toolsLineGap));
  const blockTop0 = innerY + vDetails.h + toolsH + D.gapDetailsBlock;
  const blockBot0 = innerY + cardInnerH - bandH;
  const blockTop  = blockTop0 + Math.max(0, (blockBot0 - blockTop0 - blockH)/2);

  const titleBaseline = blockTop + vTitle.ascent;
  const ruleY = blockTop + vTitle.h + D.gapTitleRule + D.ruleW/2;
  const declBaseline = blockTop + vTitle.h + D.gapTitleRule + D.ruleW + D.gapRuleDecl + vDecl.ascent;

  const qrRegionX = cardX + cardW + stripW;
  const qrOuterX = qrRegionX + (qrRegionW - qrOuter)/2;
  const qrOuterY = D.qrPad;
  const qrInset = qrSafe ? D.qrSafePad : 0;
  const miBaseline = qrOuterY + qrOuter + D.qrGap + vMi.ascent;
  const miCx = qrRegionX + qrRegionW/2;

  const ax3Zone = ax3==='band'
    ? {mode:'band', x:titleX + colLeft, y:innerY + cardInnerH - D.ax3BandH, w:colW, h:D.ax3BandH}
    : ax3==='strip'
      ? {mode:'strip', x:cardX + cardW + 5, y:D.outPad + 4, w:stripW - 10, h:H - D.outPad*2 - 8}
      : {mode:'none'};

  return {
    W, H, cardX, cardY, cardW, cardH, cardInnerH,
    iconX, iconY, iconSize:D.icon,
    titleX, titleBaseline, titleSize, titleW:wTitle, titleShrunk:shrunk,
    detailsEndX, detailsBaseline, detailsW:wDetails,
    sysName, sysNameSize, sysNameBase, sysCx,
    sysDescLines, sysDescSize, sysDescBase, sysDescLead,
    markH, markTop,
    toolLines, toolsBaselines,
    ruleY, ruleX0:titleX, ruleX1:titleX + wTitle,
    declBaseline, declCx:titleX + wTitle/2, declW:wDecl,
    qrRegionX, qrRegionW, qrOuter, qrOuterX, qrOuterY, qrInset,
    miBaseline, miCx, miW:wMi,
    ax3Zone, strings:s,
  };
}

/* ====================== ÍCONO DE MARCA (vectorial) =====================
   Dibujo de la autoría, trazado a vector. Viene como CONTORNOS RELLENOS y
   no como trazos: cada línea del dibujo es una figura cerrada con sus dos
   orillas. De ahí salen dos límites que conviene saber antes de tocarlo:
     · el grosor no se puede cambiar por código, va fijado en la forma;
     · no hay versión simplificada para tamaños pequeños, es la misma a
       cualquier tamaño.
   Se comprobó que aguanta: a 32 píxeles, que es el tamaño real del icono
   en una etiqueta impresa a 70 mm, los lóbulos, la espina y los nodos
