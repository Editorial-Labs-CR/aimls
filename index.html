<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ATENCIÓN: esto es lo que leen WhatsApp, Slack, Teams y los buscadores.
     NO ejecutan JavaScript, así que no ven el título que pone applyLang(): ven
     ESTAS etiquetas. Se quedaron con el nombre viejo del sistema durante varias
     versiones justo por eso — nadie las miraba. Hay prueba que las vigila.
     Van bilingües a propósito: el enlace se comparte en los dos idiomas. -->
<title>AIMLS · AI Manuscript Labelling System</title>
<meta name="description" content="Graphic declaration of artificial intelligence use in manuscripts · Declaración gráfica de uso de inteligencia artificial en manuscritos">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AIMLS">
<meta property="og:title" content="AIMLS · AI Manuscript Labelling System">
<meta property="og:description" content="Graphic declaration of artificial intelligence use in manuscripts · Declaración gráfica de uso de inteligencia artificial en manuscritos">
<meta property="og:url" content="https://editorial-labs-cr.github.io/aimls/">
<meta property="og:image" content="https://editorial-labs-cr.github.io/aimls/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="La etiqueta AI: ED+TR+CO con su código detallado, la frase de complementariedad y el código QR">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="es_CR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AIMLS · AI Manuscript Labelling System">
<meta name="twitter:image" content="https://editorial-labs-cr.github.io/aimls/og-image.png">
<meta name="twitter:description" content="Graphic declaration of artificial intelligence use in manuscripts · Declaración gráfica de uso de inteligencia artificial en manuscritos">
<!-- Integridad verificada: si el archivo del CDN cambiara aunque sea un byte,
     el navegador se niega a ejecutarlo y la app sigue funcionando sin QR.
     El hash se calculó del archivo real y coincide con el que publica cdnjs. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"
        integrity="sha512-pUhApVQtLbnpLtJn6DuzDD5o2xtmLJnJ7oBoMsBnzOkVkpqofGLGPaBJ6ayD2zQe3lCgCibhJBi4cj5wAxwVKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    --ink:#101114;
    --paper:#ffffff;
    --muted:#6b6d75;
    --line:#e2e2e6;
    --panel:#f2f2f4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--panel);
    color:var(--ink);
    padding:22px;
    font-size:14px;
  }
  header{max-width:1400px;margin:0 auto 18px;}
  h1{font-size:18px;margin:0 0 5px;letter-spacing:-0.015em;}
  .sub{font-size:13px;color:var(--muted);margin:0;line-height:1.5;max-width:70ch;}
  .layout{display:flex;flex-direction:column;gap:18px;max-width:1400px;margin:0 auto;}
  @media (min-width:1040px){
    .layout{flex-direction:row;align-items:flex-start;}
    .controls{width:420px;flex-shrink:0;position:sticky;top:22px;}
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .topbar h1{margin:0;}
  .brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:5px;}
  .brand-desc{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.01em;}
  .topnav{display:flex;gap:6px;align-items:center;}
  .prose-lang{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);}
  .code[data-tip]{cursor:help;}
  .desc .eg{display:block;margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.4;}
  /* El selector de idioma de la pantalla se agrupa con su rótulo y un globo
     dentro de un solo recuadro: así se lee como UN control y no como un
     rótulo suelto al lado de una lista. Es el primer ajuste que hace quien
     opera, y antes pasaba desapercibido entre los botones de la barra. */
  .langgroup{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:9px;padding:4px 8px 4px 10px;background:#fff;}
  .langgroup:focus-within{outline:2px solid var(--ink);outline-offset:2px;}
  .langgroup .globe{width:15px;height:15px;flex:0 0 auto;display:block;}
  .langlbl{font-size:12px;font-weight:600;color:var(--ink);letter-spacing:0;}
  .topnav{flex-wrap:wrap;}
  .langsel{padding:2px 2px 2px 9px;border:none;border-left:1px solid var(--line);border-radius:0;font:700 13px/1.2 inherit;font-family:inherit;background:#fff;color:var(--ink);cursor:pointer;}
  .langsel:focus{outline:none;}
  .navbtn{padding:6px 12px;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:7px;font:600 12.5px/1.2 inherit;font-family:inherit;cursor:pointer;}
  .navbtn:hover{background:var(--ink);color:#fff;}
  .foot{max-width:1400px;margin:26px auto 4px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.7;color:var(--muted);}
  .foot a{color:var(--ink);}
  .foot .sep{margin:0 6px;color:#b9bbc1;}
  .foot .lic{display:inline-block;border:1px solid var(--ink);border-radius:4px;padding:0 5px;font-weight:700;color:var(--ink);font-size:10.5px;}
  .foot button{border:none;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer;}
  .dlg{border:none;border-radius:14px;padding:0;width:min(760px, calc(100vw - 32px));max-height:86vh;color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .dlg::backdrop{background:rgba(16,17,20,.55);}
  .dlg-in{padding:24px 28px 8px;overflow:auto;max-height:calc(86vh - 64px);font-size:13.5px;line-height:1.6;}
  .dlg-in h2{font-size:19px;margin:0 0 6px;}
  .dlg-in h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 6px;}
  .dlg-in .lead{color:var(--muted);margin:0 0 4px;}
  .dlg-in ol,.dlg-in ul{padding-left:20px;margin:6px 0;}
  .dlg-in li{margin-bottom:4px;}
  .dlg-in table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0;}
  .dlg-in th,.dlg-in td{text-align:left;vertical-align:top;padding:5px 8px;border-bottom:1px solid var(--line);}
  .dlg-in th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .dlg-in code{font-size:12px;background:#f2f2f4;padding:1px 4px;border-radius:4px;}
  .dlg-in .cite{border-left:3px solid var(--ink);padding-left:10px;}
  .toc{border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px;margin:14px 0 4px;background:#fafafb;}
  .toc-t{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
  /* Sin viñetas ni numeración propia: los títulos del manual ya vienen
     numerados («1. Cómo generar la etiqueta»), y una lista numerada encima
     los duplicaba. */
  .toc ul{margin:0;padding-left:0;list-style:none;}
  .toc li{margin-bottom:2px;}
  .toc .tocgo{border:none;background:none;padding:0;margin:0;font:inherit;font-size:13px;color:var(--ink);text-align:left;text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
  .toc .tocgo:hover{text-decoration-thickness:2px;}
  .toc .tocgo:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px;}
  .dlg-in h3:focus{outline:none;}
  .dlg-in details summary{cursor:pointer;font-weight:600;margin-top:8px;}
  .dlg-in p.warn{border-left:3px solid var(--ink);padding-left:10px;}
  .dlg-in .lic-text{white-space:pre-wrap;font-size:11px;line-height:1.5;background:#f6f6f8;padding:10px 12px;border-radius:8px;max-height:260px;overflow:auto;}
  .prose h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;}
  .prose-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .prose-tools{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .prose-tools select{padding:5px 7px;border:1px solid #cfcfd4;border-radius:7px;font-family:inherit;font-size:12.5px;background:#fff;}
  .prose-box{font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.7;color:var(--ink);
             background:#fafafb;border:1px solid var(--line);border-radius:9px;padding:14px 16px;}
  .prose-box mark.ph{background:#ececf0;color:var(--ink);border-bottom:1.5px dashed #8a8c93;padding:0 2px;font-style:italic;}
  .dlg-foot{padding:10px 28px 16px;text-align:right;border-top:1px solid var(--line);margin:0;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;}
  fieldset{border:none;padding:0;margin:0 0 18px;}
  legend{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:9px;padding:0;}
  .task-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid #f0f0f2;}
  .task-row:last-child{border-bottom:none;}
  .tool-row{display:grid;grid-template-columns:1fr 1fr 30px;gap:6px;margin-bottom:6px;}
  .tool-row input{width:100%;min-width:0;padding:7px 8px;border:1px solid #cfcfd4;border-radius:7px;font-size:12.5px;font-family:inherit;color:var(--ink);background:#fff;}
  .tool-row .rm{border:1px solid #cfcfd4;background:#fff;border-radius:7px;cursor:pointer;font-size:16px;line-height:1;color:var(--muted);}
  .tool-row .rm:hover{color:var(--ink);border-color:var(--ink);}
  .addtool{padding:6px 10px;border:1px dashed #b9bbc1;background:#fff;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .addtool:disabled,.tool-row :disabled{opacity:.45;cursor:not-allowed;}
  #toolsBox.off{opacity:.5;}
  .task-row.off .levels{opacity:.35;}
  .task-row.off .levels button{cursor:help;}
  .task-row label{flex:1;display:flex;flex-direction:column;cursor:pointer;line-height:1.25;}
  .task-row .code{font-weight:700;font-size:13px;letter-spacing:0.01em;}
  .task-row .desc{font-size:11px;color:var(--muted);}
  .task-row .stm{font-size:9.5px;font-weight:600;color:#9a9ca3;letter-spacing:0.04em;margin-left:5px;}
  .levels button:first-child{width:28px;}
  .levels button:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}

  /* Guía flotante de los grados de uso. El title nativo del navegador no
     sirve: tarda ~1 s en aparecer, no se puede estilar y en pantalla táctil
     directamente no existe. Este aparece al instante, con el foco del
     teclado también, y al tocar en móvil. */
  #tip{position:fixed;z-index:99;max-width:260px;background:var(--ink);color:#fff;
       padding:8px 10px;border-radius:7px;font-size:12px;line-height:1.4;
       pointer-events:none;opacity:0;transform:translateY(3px);
       transition:opacity .12s ease,transform .12s ease;
       box-shadow:0 6px 22px rgba(0,0,0,.24);}
  #tip.on{opacity:1;transform:none;}
  #tip b{display:block;font-size:12.5px;margin-bottom:3px;}
  #tip small{color:#b3b5bc;font-size:11px;display:block;}
  #tip::after{content:'';position:absolute;left:var(--ax,50%);bottom:-5px;margin-left:-5px;
              border:5px solid transparent;border-top-color:var(--ink);border-bottom:0;}
  #tip.below::after{bottom:auto;top:-5px;border-top:0;border-bottom-color:var(--ink);}

  /* Leyenda siempre visible: para orientarse de un vistazo, sin tener que
     ir a buscar cada número con el mouse. */
  .legend{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;
          margin-top:10px;padding-top:9px;border-top:1px solid #eee;font-size:10.5px;color:var(--muted);}
  .legend .lt{font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:9.5px;}
  .legend .li{display:inline-flex;align-items:center;gap:4px;cursor:help;white-space:nowrap;}
  .legend .li b{display:inline-flex;align-items:center;justify-content:center;
                min-width:16px;height:16px;border:1px solid #cfcfd4;border-radius:4px;
                font-size:10px;color:var(--ink);background:#fff;}
  .legend .li:hover b{background:var(--ink);color:#fff;border-color:var(--ink);}
  .task-row.nodecl{background:#fafafb;border-radius:7px;padding:8px;margin-top:6px;border-bottom:none;}
  .task-row.nodecl .lock{width:16px;text-align:center;color:#b9bbc1;flex-shrink:0;}
  .task-row.nodecl .desc{color:#8a8c93;}
  .tag{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:0.06em;background:#e6e6ea;color:#6b6d75;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:1px;}
  .levels{display:flex;gap:3px;}
  .levels button{width:25px;height:25px;border:1px solid #cfcfd4;background:#fff;border-radius:6px;font-size:11.5px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .levels button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);flex-shrink:0;}
  .field{margin-bottom:13px;}
  .field > label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:5px;}
  .field input[type=text],.field select{width:100%;padding:8px;border:1px solid #cfcfd4;border-radius:7px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);}
  .check{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12.5px;line-height:1.35;}
  .check span small{display:block;color:var(--muted);font-size:11px;}
  .preview-wrap{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;}
  #badgeHost{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:26px;display:flex;justify-content:center;align-items:center;min-height:180px;overflow:auto;}
  #badgeHost.dark{background:#1b1c20;}
  #badgeHost svg{max-width:100%;height:auto;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .actions button{flex:1;min-width:130px;padding:10px 12px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .actions button.secondary{background:#fff;color:var(--ink);}
  .actions button:disabled{opacity:.35;cursor:not-allowed;}
  .meta{font-size:11.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;}
  .meta b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .note{font-size:11.5px;color:var(--muted);line-height:1.5;margin:10px 0 0;}
  .empty-hint{font-size:13px;color:var(--muted);padding:34px;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand"><h1 data-i18n="appName"></h1><span class="brand-desc" data-i18n="appDesc"></span></div>
    <nav class="topnav">
      <!-- Ajuste global de quien opera la herramienta: va acá arriba y no entre
           los controles de la etiqueta, para que no se confunda con el idioma
           que SÍ entra al artículo. Opciones construidas en JS desde LANGS. -->
      <div class="langgroup">
        <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
        <label class="langlbl" for="lang" data-i18n="lblLang"></label>
        <select id="lang" class="langsel" data-i18n-tip="tipLang" data-i18n-tipsub="tipLangSub"></select>
      </div>
      <button type="button" class="navbtn" data-open="dlgManual" data-i18n="navManual"></button>
      <button type="button" class="navbtn" data-open="dlgAbout" data-i18n="navAbout"></button>
    </nav>
  </div>
  <p class="sub" style="font-size:14px;color:var(--ink);margin-bottom:10px" data-i18n="hdrTag"></p>
  <p class="sub" data-i18n="hdrOpen"></p>
  <p class="sub" style="margin-top:7px" data-i18n="hdrVocab"></p>
  <p class="sub" style="margin-top:7px" data-i18n="hdrAxes"></p>
</header>

<div class="layout">
  <div class="controls">
    <div class="card">
      <!-- Primero el idioma: gobierna la etiqueta Y la prosa, así que escogerlo
           al final obliga a releer lo ya generado. El otro eje de idioma vive
           en la barra superior porque es de quien opera la herramienta. Los
           códigos no dependen de ninguno: son invariantes. -->
      <fieldset>
        <legend data-i18n="legStart"></legend>
        <div class="field" style="margin-bottom:2px">
          <label for="docLang" data-i18n="lblDocLang"></label>
          <select id="docLang" data-i18n-tip="tipDocLang" data-i18n-tipsub="tipDocLangSub"></select>
          <p class="note" data-i18n="noteDocLang"></p>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="legAxes"></legend>
        <div id="taskList"></div>
        <!-- Va acá y no entre las notas del final: es donde la persona decide
             qué marcar, y la duda «¿esto se declara?» aparece en ese momento. -->
        <p class="note" data-i18n="noteThreshold"></p>
      </fieldset>

      <fieldset id="toolsBox">
        <legend data-i18n="legTools"></legend>
        <div id="toolList"></div>
        <button type="button" id="btnAddTool" class="addtool" data-i18n="btnAddTool"></button>
        <p class="note" data-i18n="noteTools"></p>
      </fieldset>


      <fieldset>
        <legend data-i18n="legProd"></legend>
        <div class="field">
          <label for="qrUrl" data-i18n="lblQrUrl"></label>
          <input type="text" id="qrUrl" value="https://editorial-labs-cr.github.io/aimls/" spellcheck="false">
        </div>
        <label class="check"><input type="checkbox" id="optQrSafe" checked><span data-i18n="optQrSafe"></span></label>
        <label class="check"><input type="checkbox" id="optEmbed" checked><span data-i18n="optEmbed"></span></label>
        <label class="check"><input type="checkbox" id="optDark"><span data-i18n="optDark"></span></label>

        <div class="field">
          <label for="pngScale" data-i18n="lblScale"></label>
          <select id="pngScale">
            <option value="1" data-i18n="sc1"></option>
            <option value="2" selected data-i18n="sc2"></option>
            <option value="4" data-i18n="sc4"></option>
          </select>
        </div>
      </fieldset>

      <p class="note" style="border-left:3px solid var(--ink);padding-left:9px" data-i18n="noteCodes"></p>
      <p class="note" style="border-left:3px solid #a32020;padding-left:9px" data-i18n="noteQr"></p>
      <p class="note" data-i18n="noteForm"></p>
      <p class="note" data-i18n="noteAxis2"></p>
      <p class="note" id="fontNote"></p>
    </div>
  </div>

  <div class="preview-wrap">
    <div id="badgeHost"></div>
    <div class="actions">
      <button id="btnPng" data-i18n="btnPng"></button>
      <button id="btnSvg" class="secondary" data-i18n="btnSvg"></button>
      <button id="btnProse" class="secondary" aria-expanded="false" aria-controls="proseCard" data-i18n="btnProse"></button>
    </div>

    <div class="card prose" id="proseCard" hidden>
      <div class="prose-head">
        <h2 data-i18n="proseTitle"></h2>
        <div class="prose-tools">
          <span class="prose-lang" id="proseLangTag"></span>
          <button type="button" id="btnCopy" class="navbtn" data-i18n="btnCopy"></button>
        </div>
      </div>

/* =========================================================================

   -------------------------------------------------------------------------
   Arquitectura en tres pasos, deliberadamente separados:
     1. state      -> qué declaró el autor
     2. strings    -> notación textual (Eje 1 + Eje 2)
     3. layout     -> geometría medida (sin números mágicos)
     4. render     -> string SVG puro, sin dependencia del DOM

   ========================================================================= */

function footerHTML(){
  const sep = '<span class="sep">·</span>';
  return `<b>${esc(U.appName)}</b> ${w('version')} ${APP.version}${sep}`
    + `${w('devBy')} <b>${APP.author}</b>${sep}${orcidLink()}${sep}${mailLink()}<br>`
    + `${APP.unit[lang]}, ${APP.univ}<br>`
    + `${w('openSrc')}: `
    + `<span class="lic">MIT</span> ${mitLink(w('code'))} `
    + `<span class="lic">CC BY 4.0</span> ${licLink(w('content'))}${sep}`
    + `<button type="button" data-open="dlgManual">${U.navManual}</button>${sep}`
    + `<button type="button" data-open="dlgAbout">${U.navAbout}</button>`;
}

function codesTable(){
  const rows = TASKS.map(t=>{
    const code = t.code ? `<code>${t.code}</code>` : '—';
    const stm  = t.stm ?? '—';
    // la actividad 9 lleva la marca en ambos idiomas (en español venía dentro del texto)
    const desc = (t.declarable===false
      ? `<b>${U.tagNotDecl}.</b> ${esc(t[lang].replace(/^No declarable\.\s*/,''))}`
      : (t.tag ? `<b>${esc(U[t.tag])}.</b> ${esc(t[lang])}` : esc(t[lang])))
      + (t.eg ? `<br><small>${esc(t.eg[lang])}</small>` : '')
      + (t.scopeNote ? `<br><small>${esc(t.scopeNote[lang])}</small>` : '');
    return `<tr><td>${code}</td><td>${t.from ? `<i>${esc(fromLabel(t))}</i>` : '—'}</td><td>${stm}</td><td>${desc}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>${w('thCode')}</th><th>${w('thFrom')}</th><th>STM</th><th>${w('thDesc')}</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function extentTable(){
  const rows = [0,1,2,3,4].map(lv=>{
    const E = EXTENTS[lv];
    return `<tr><td>${lv===0?'—':lv}</td><td>${esc(E[lang])}</td><td>${esc(refOf(lv) || w('valid'))}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>${w('thLevel')}</th><th>${w('thMean')}</th><th>${w('thGuide')}</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function manualHTML(){
  if(lang==='en') return `
<h2 id="manualTitle">User guide</h2>
<p class="lead">AIMLS (<i>AI Manuscript Labelling System</i>) produces a graphic label that summarises, at a glance, how artificial intelligence was used in a manuscript. The label <b>complements</b> the prose declaration requested by the journal or publishing body: it does not replace it.</p>
<h3>1. How to create the label</h3>
<ol>
<li><b>Tick the tasks</b> where AI was used (Axis 1). If there was no use above the disclosable threshold, keep <b>N</b> ticked: it is the starting option.</li>
<li><b>Optional: state the extent</b> of each task (Axis 2) with buttons 1 to 4. "—" means you do not state it, which is a valid declaration. Hover over each number to see what it means.</li>
<li><b>Optional: add the tools and models</b> you used (up to 6). Empty rows are ignored.</li>
<li>Choose the <b>label and prose language</b>: the language of the article. It sets the descriptions inside the label and the language of the prose. It is independent of the screen language, and it does not touch the codes.</li>
<li>Enter the <b>QR URL</b>: the page that explains the system or the policy of the journal or publishing body.</li>
<li><b>Download</b> the label as PNG (image) or SVG (vector).</li>
</ol>
<h3>2. How to read the label</h3>
<ul>
<li><b>Title</b> (<code>AI: ED+TR</code>): the declared tasks.</li>
<li><b>Top line</b> (<code>AI: ED:1+TR:3</code>): the same string with each task's extent; if none was stated it says so, in the label language.</li>
<li><b>Tools line</b>: the tools and models, when given.</li>
<li><b>Bottom phrase</b>: a reminder that the label complements the prose declaration.</li>
<li><b>QR code</b>: links to the explanation of the system.</li>
</ul>
<h3>3. Notation rules</h3>
<ul>
<li><code>AI</code> appears once, at the start, followed by ": ".</li>
<li>Codes are joined with "+", without spaces, always in the order of the STM classification, not in the order they were ticked.</li>
<li>The extent is attached to its code (<code>ED:1</code>) and is left out when it is not stated.</li>
<li><code>AI: N</code> excludes every other task.</li>
<li><b>The codes are never translated.</b> <code>AI</code>, the "+" and the task codes are always in English, so the same declaration yields the same string in any country. The descriptions inside the label (and the prose) do follow the label language.</li>
</ul>
<h3>4. Codes</h3>
${codesTable()}
<h3>5. Extent of use (optional)</h3>
<p>Extent answers a single question, and it is answered <b>per task</b>: how much of this did the AI do?</p>
<p><b>The point of comparison is the task, not the article.</b> If you tick images and enter 4, you are saying that practically all the figures come from the tool; that says nothing about the text, which may be entirely yours.</p>
${extentTable()}
<p>The proportions are guidance, not strict thresholds.</p>
<h3>6. Where and how to place it</h3>
<ul>
<li>On a prominent page of the article, usually the first.</li>
<li>Alongside the prose declaration, which remains required when the journal or body that publishes or reviews asks for it: it names the tool, describes the use and records human verification.</li>
<li>Use the <b>SVG</b> for layout and the <b>4× PNG</b> for print. Never distort the label: always scale it proportionally.</li>
<li>In print, keep the QR code at least about 2 cm wide so a phone can read it.</li>
</ul>
<h3>7. What gets declared and what does not</h3>
<p><b>Always declare</b> any use of activities <b>2 to 8</b>: generating content, translating, handling data, images, visualisations, code or references. <b>However little was used</b>: if it was used, it is declared.</p>
<p><b>You need not declare</b> activity <b>1</b>: spell checker, grammar and style polishing. That is the threshold.</p>
<p><b>If you used activity 1 along with others</b>, there is no need to tick it: tick only the others and leave it unticked.</p>
<p><b>If there was nothing above activity 1</b>, the correct declaration is <code>AI: N</code>, which is exclusive and clears the rest. That is why <code>N</code> does not say "no tool was used": it says there was no use above the threshold. Without that distinction, anyone who ran a spell checker would be declaring inaccurately.</p>
<p class="warn"><b>Do not confuse this with Axis 2.</b> The extent being optional does not make the task optional: <code>AI: TR</code> with no number is a valid declaration, but <b>saying nothing</b> about having translated is not.</p>
<p>The threshold is not this system's invention: the 2023 STM Guidelines recommend that activity 1 need not be disclosed, and a review of the policies of eleven large-scale publishers finds the same: minor assistive uses for grammar and style typically are not disclosed, and substantive ones are.</p>
<p><b>If the journal or body that publishes asks for more, its policy wins.</b> It may set its threshold lower and require activity 1 to be disclosed too; the <code>ED</code> code is available for that, and for anyone who wishes to disclose it voluntarily.</p>
<h3>8. Frequently asked questions</h3>
<p><b>Does AIMLS detect whether a text was written by an AI?</b> No. AIMLS does not analyse the manuscript or estimate anything: it only turns what you declare into a label. It is a declaration system, not a detection system.</p>
<p><b>Does it work for a thesis or a report, or only for journal articles?</b> It works for any manuscript. The vocabulary describes the preparation of a document submitted for publication or assessment, and that includes theses, reports and book chapters.</p>
<p><b>How do I choose the extent?</b> It is your estimate, not a measurement, and it is optional: you may tick the task and leave the level at "—". If you do declare it, the question is how much of <b>that task</b> the tool did, not how much of the article. If you translated the text with AI help, it is 4 even though translation is a small part of all your work. The proportions are guidance: nobody expects you to count words.</p>

let U = UI.en;   // por defecto inglés; el arranque lo re-lee del selector

function applyLang(){
  /* Red de seguridad: si `lang` no es uno de los idiomas que existen, se cae
     al inglés en vez de reventar. Hoy no es alcanzable (el valor solo sale
     del selector), pero el día que LANGS cambie o un navegador restaure un
     valor viejo de formulario, la app sigue en pie en vez de quedar en
     blanco. Cuesta una línea. */
  if(!UI[lang]) lang = 'en';
  U = UI[lang];
  document.documentElement.lang = lang;
  document.title = U.docTitle;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = U[el.getAttribute('data-i18n')];
    if(v !== undefined) el.innerHTML = v;
  });
  /* Guías flotantes cuyo texto también se traduce. Van como atributo, no como
     contenido, así que no las alcanza el bucle de arriba. */
  document.querySelectorAll('[data-i18n-tip]').forEach(el=>{
    el.setAttribute('data-tip', U[el.getAttribute('data-i18n-tip')] || '');
    const sub = el.getAttribute('data-i18n-tipsub');
    if(sub) el.setAttribute('data-tip-sub', U[sub] || '');
  });

/* --- Índice del manual ----------------------------------------------------
   Se arma leyendo los <h3> que el manual ya trae, no de una lista aparte:
   si mañana se agrega, se quita o se renombra una sección, el índice cambia
   con ella y no hay forma de que quede desfasado. Funciona igual en los tres
   idiomas sin traducir nada más que la palabra «Contenido».
   El salto no usa href="#id" porque el manual vive dentro de un <dialog> con
   su propio contenedor con barra de desplazamiento: un ancla movería la
   página de atrás, no el diálogo. Se mueve el scrollTop del contenedor. */
function indiceManual(){
  const cuerpo = $('manualBody');
  const hs = [...cuerpo.querySelectorAll('h3')];
  if(hs.length < 2) return;
  const items = hs.map((h,i)=>{
    const id = 'man-s' + i; h.id = id;
    return `<li><button type="button" class="tocgo" data-goto="${id}">${esc(h.textContent)}</button></li>`;
  }).join('');
  const nav = document.createElement('nav');
  nav.className = 'toc';
  nav.setAttribute('aria-label', U.manualToc);
  nav.innerHTML = `<p class="toc-t">${esc(U.manualToc)}</p><ul>${items}</ul>`;
  // Va después del <h2> y del párrafo de entrada, antes de la primera sección.
  cuerpo.insertBefore(nav, hs[0]);
  nav.addEventListener('click', ev=>{
    const b = ev.target.closest('.tocgo'); if(!b) return;
    const destino = cuerpo.querySelector('#' + b.dataset.goto);
    const caja = cuerpo.closest('.dlg-in');
    if(!destino || !caja) return;
    caja.scrollTop = destino.offsetTop - caja.offsetTop - 8;
    destino.setAttribute('tabindex','-1'); destino.focus({preventScroll:true});
  });
}

/* --- Cadenas de la etiqueta -----------------------------------------------
   EL CÓDIGO VA SIEMPRE EN INGLÉS; las descripciones no (2026-09-23).
   Invariante: el prefijo `AI`, el «: », el «+» y los códigos de tarea. Eso
   es lo que viaja con el artículo a bases de datos, agregadores y servicios
   de metadatos, y su valor entero depende de que dos revistas que declaran
   lo mismo produzcan la MISMA cadena — si se tradujera, dejaría de ser un
   código y pasaría a ser una frase.
   Traducible: lo que la etiqueta dice en lengua natural (la frase de
   complementariedad, «More info», el rótulo de herramientas y el aviso de
   extensión no declarada). Sigue a `docLang`, el idioma de la ETIQUETA,
   porque se imprime dentro del artículo — no a `lang`, que es el de quien
   opera la herramienta.

   FORMA (decidida 2026-09-14):  AI: ED+TR+CO
   · el prefijo `AI` aparece UNA sola vez, al inicio
   · siempre seguido de dos puntos y un espacio, «: »
   · los códigos se separan con «+», sin espacios

   El «+» y no el guion: el guion se parte en los saltos de línea de un PDF
   a dos columnas (y ahí ya no se sabe si separaba o partía), los
   procesadores de texto lo reescriben solos como raya, y en el §4.4 el
   guion ya cumple otra función —unir prefijo y código—, de modo que
   haría dos trabajos opuestos. El «+» además se lee como suma, que es lo
   que la declaración significa: usos concurrentes.
   ------------------------------------------------------------------------ */
/* INVARIANTE en todos los idiomas. Esto es el CÓDIGO de la etiqueta: lo que
   se compara, se agrega y se busca entre revistas de cualquier país. Si se
   tradujera, dos revistas que declaran lo mismo producirían cadenas distintas
   y la etiqueta perdería su única razón de ser. */
const BADGE = {
  prefix  : 'AI: ',
  sep     : '+',
  toolsSep: ' · ',          // no «+»: ese signo ya separa códigos
};

/* TRADUCIBLE. Esto son DESCRIPCIONES, no código: dicen en lengua natural qué
   es la etiqueta. Siguen al idioma de la ETIQUETA (docLang), no al de la
   interfaz, porque se imprimen dentro del artículo.
   «declaration» sustituye a «Standard Declaration»: dice qué ES la etiqueta
   respecto de la declaración que ya pide la revista — la complementa, no la
   reemplaza. */
const BADGE_L = {
  es:{ declaration:'Complementa la declaración en prosa del texto',
       toolsLead:'Herramientas: ', moreInfo:'Más información',
       noUse:'SIN USO POR ENCIMA DEL UMBRAL', noExtent:'EXTENSIÓN NO DECLARADA' },
  en:{ declaration:'Complements the prose declaration in the text',
       toolsLead:'Tools: ', moreInfo:'More info',
       noUse:'NO USE ABOVE THRESHOLD', noExtent:'EXTENT NOT DECLARED' },
  pt:{ declaration:'Complementa a declaração em prosa do texto',
       toolsLead:'Ferramentas: ', moreInfo:'Mais informações',
       noUse:'SEM USO ACIMA DO LIMIAR', noExtent:'EXTENSÃO NÃO DECLARADA' },
};
/* El motor de composición solo conoce `T`: se recompone al cambiar docLang. */
let T = Object.assign({}, BADGE, BADGE_L.en);
function applyDocLang(){ T = Object.assign({}, BADGE, BADGE_L[docLang]); }

/* =========================== 1. ESTADO ================================= */
let state = {};                 // code -> extensión 0..4 (0 = no declarada). La clave existe = tarea marcada

const clean = v => String(v||'').replace(/\s+/g,' ').trim();
function toolItems(){
  return toolRows.map(r=>({n:clean(r.name), m:clean(r.model)}))
                 .filter(r=>r.n)
                 .map(r=> r.m ? `${r.n} (${r.m})` : r.n);

/* Idiomas PRESENTES en los diccionarios frente a idiomas OFRECIDOS en la

   usuario el 2026-09-23). Se reactiva metiendo 'pt' en LANGS — nada más.
   Se mantiene dentro de LANG_ALL a propósito, para que las pruebas de
   completitud lo sigan cubriendo y la traducción no se pudra mientras
   espera revisión. */
const LANG_ALL  = ['es','en','pt'];
const LANGS     = ['es','en'];
const LANGNAME  = {es:'Español', en:'English', pt:'Português'};

/* DOS EJES DE IDIOMA, deliberadamente separados (decidido 2026-09-23):
   · lang    — idioma de la INTERFAZ: para quien opera la herramienta.
   · docLang — idioma de la ETIQUETA (el del artículo): gobierna a la vez las descripciones de
               la etiqueta y la prosa, porque las dos cosas entran al mismo
               artículo y no pueden ir en lenguas distintas.
   Lo que NO depende de ninguno de los dos son los códigos (`AI: `, `+`, ED,
   TG, TR…): son invariantes en inglés por diseño, porque son lo que se
   compara y se agrega entre revistas de cualquier país. */
let lang    = 'en';
let docLang = 'en';

/* =========================== 2. STRINGS ================================
   Una sola función produce las dos cadenas, del mismo acto declarativo —
   que es el principio de diseño del §3 del preprint: la prosa, la etiqueta
   y los metadatos salen de una sola captura, para que no puedan divergir.
   ====================================================================== */
function selectedCodes(){ return ORDER.filter(c => c in state); }   // ya en orden STM

/* ======================== PROSA DE LA DECLARACIÓN =======================
   La segunda de las tres salidas del §5 del preprint. Sale del MISMO estado
   que la etiqueta (una sola captura, §3): etiqueta y prosa no pueden
   contradecirse porque no hay dos fuentes.

   Es un BORRADOR a propósito. La prosa vale por lo que cuenta del caso
   concreto —qué se hizo y en qué secciones— y eso solo lo sabe quien
   declara. Esos huecos se marcan entre corchetes en vez de rellenarse con
   algo genérico que invite a pegarlo tal cual.

   Devuelve segmentos {t, ph}: ph = marcador que el autor debe completar.
   ====================================================================== */
const PROSE = {
  es:{
    none   : 'Las personas autoras declaran que en la preparación de este manuscrito no se utilizaron herramientas de inteligencia artificial por encima del umbral declarable, es decir, más allá de la corrección ortográfica, gramatical o de estilo.',
    lead1  : 'En la preparación de este manuscrito se utilizaron herramientas de inteligencia artificial para la siguiente tarea: ',
    leadN  : 'En la preparación de este manuscrito se utilizaron herramientas de inteligencia artificial para las siguientes tareas: ',
    extent : lv => `extensión ${lv}`,
    tools  : 'Herramientas utilizadas: ',
    toolPh : '[Indique la herramienta y su versión, p. ej. ChatGPT (GPT-5).]',
    whatPh : '[Describa brevemente qué se hizo con cada herramienta y en qué secciones del manuscrito.]',
    verify : 'Todo el contenido generado o modificado con estas herramientas fue revisado por las personas autoras, quienes verificaron su pertinencia y veracidad y asumen la responsabilidad plena por el contenido final.',
    label  : 'Etiqueta de declaración: ',
  },
  en:{
    none   : 'The authors declare that no artificial intelligence tools were used in the preparation of this manuscript above the disclosable threshold, that is, beyond spelling, grammar or style correction.',
    lead1  : 'Artificial intelligence tools were used in the preparation of this manuscript for the following task: ',
    leadN  : 'Artificial intelligence tools were used in the preparation of this manuscript for the following tasks: ',
    extent : lv => `${lv} extent`,
    tools  : 'Tools used: ',
    toolPh : '[State the tool and its version, e.g. ChatGPT (GPT-5).]',
    whatPh : '[Briefly describe what was done with each tool and in which sections of the manuscript.]',
    verify : 'All content generated or modified with these tools was reviewed by the authors, who verified its relevance and accuracy and take full responsibility for the final content.',
    label  : 'Declaration label: ',
  },
  pt:{
    none   : 'Os autores declaram que na preparação deste manuscrito não foram utilizadas ferramentas de inteligência artificial acima do limiar declarável, isto é, além da correção ortográfica, gramatical ou de estilo.',
    lead1  : 'Na preparação deste manuscrito foram utilizadas ferramentas de inteligência artificial para a seguinte tarefa: ',
    leadN  : 'Na preparação deste manuscrito foram utilizadas ferramentas de inteligência artificial para as seguintes tarefas: ',
    extent : lv => `extensão ${lv}`,
    tools  : 'Ferramentas utilizadas: ',
    toolPh : '[Indique a ferramenta e sua versão, p. ex. ChatGPT (GPT-5).]',
    whatPh : '[Descreva brevemente o que foi feito com cada ferramenta e em quais seções do manuscrito.]',
    verify : 'Todo o conteúdo gerado ou modificado com estas ferramentas foi revisado pelos autores, que verificaram sua pertinência e veracidade e assumem a responsabilidade plena pelo conteúdo final.',
    label  : 'Etiqueta de declaração: ',
  },
};
const lcFirst = t => t.charAt(0).toLowerCase() + t.slice(1);

/* «A y B», «A, B y C» — y «e» ante palabra que empieza por el sonido /i/
   (ChatGPT e Illustrator). En inglés, coma serial (APA): «A, B, and C».
   En portugués, «e» sin alternancia y SIN coma serial: «A, B e C». */
function joinList(arr, pl){
  if(arr.length < 2) return arr.join('');
  const last = arr[arr.length-1], rest = arr.slice(0,-1);
  if(pl==='en') return arr.length===2 ? `${rest[0]} and ${last}` : `${rest.join(', ')}, and ${last}`;
  if(pl==='pt') return `${rest.join(', ')} e ${last}`;
  const y = /^h?i(?![aeouáéóú])/i.test(last) ? 'e' : 'y';
  return `${rest.join(', ')} ${y} ${last}`;
}

function proseSegments(pl){
  const P = PROSE[pl];
  const s = badgeStrings();
  if(!s) return [];
  if(state.N) return [{t:P.none}, {t:' '+P.label + s.canonical + '.'}];

  /* Las tareas llevan comas internas («refinamiento, corrección, edición o
     formato…»): separarlas con comas las haría ilegibles. Con más de una se
     enumeran (a), (b)… y se separan con punto y coma. */
  const items = s.codes.map(c=>{
    const t = TASKS.find(x=>x.code===c);
    const lv = state[c] || 0;
    const ext = lv ? ` (${P.extent(EXTENTS[lv][pl].split(':')[0].toLowerCase())})` : '';
    return lcFirst(t[pl]) + ext;
  });
  const tareas = items.length===1
    ? P.lead1 + items[0] + '.'
    : P.leadN + items.map((x,i)=>`(${String.fromCharCode(97+i)}) ${x}`).join('; ') + '.';

  const seg = [{t:tareas}, {t:' '}];
  if(s.tools.length) seg.push({t:P.tools + joinList(s.tools, pl) + '.'});
  else               seg.push({t:P.toolPh, ph:true});
  seg.push({t:' '}, {t:P.whatPh, ph:true}, {t:' '}, {t:P.verify}, {t:' '+P.label + s.canonical + '.'});
  return seg;
}
const proseText = pl => proseSegments(pl).map(x=>x.t).join('');
const proseHTML = pl => proseSegments(pl).map(x=> x.ph ? `<mark class="ph">${esc(x.t)}</mark>` : esc(x.t)).join('');

function badgeStrings(){
  const P = BADGE.prefix, S = BADGE.sep;
  if(state.N) return {title:P+'N', details:T.noUse, canonical:P+'N', codes:['N'], tools:[]};
  const codes = selectedCodes();
  if(!codes.length) return null;

  // Título: prefijo una vez + códigos unidos por «+».      AI: ED+TR+CO
  const title = P + codes.join(S);

  // Cadena canónica: lo mismo, con la extensión pegada al código que la
  // declaró. La extensión se OMITE cuando no se declara (§4.2).
  const canonical = P + codes.map(c => c + (state[c] ? ':' + state[c] : '')).join(S);

  // La línea de detalle solo aporta si hay alguna extensión; si no, lo dice.
  // Hacer visible la ausencia de dato es el mismo argumento del §4.5 sobre N.
  const anyExtent = codes.some(c => state[c] > 0);
  return {title, details: anyExtent ? canonical : T.noExtent, canonical, codes, tools: toolItems()};
}

/* =========================== MEDICIÓN ==================================
   Dos instrumentos, porque miden cosas distintas:

   · ANCHO  -> getBBox() sobre un <text> SVG real. Es la única medida que
     coincide con lo que el navegador va a dibujar en el SVG exportado
     (incluye letter-spacing y el avance del último glifo).
   · ALTO   -> canvas.measureText().actualBoundingBox*, que sí da la TINTA
     real. getBBox() de texto en Chrome devuelve la caja de la fuente
     (ascender+descender del em), no la tinta: como acá todo es
     versalita/dígito, eso metía ~30 unidades de aire fantasma arriba y
     abajo y dejaba la etiqueta rechoncha frente al mockup.

   Además el alto se mide contra CADENAS DE REFERENCIA fijas, no contra el
   texto real. Eso hace que TODAS las etiquetas del sistema tengan el mismo
   alto: AI:N y AI:TR-ED-BI-DA-CO-GE-IM se alinean en una misma línea de
   una página. Solo varía el ancho.
   ====================================================================== */
const measSvg = document.createElementNS(NS,'svg');
measSvg.setAttribute('width','10'); measSvg.setAttribute('height','10');
Object.assign(measSvg.style,{position:'absolute',left:'-10000px',top:'0',overflow:'hidden'});
const measText = document.createElementNS(NS,'text');
measSvg.appendChild(measText);
document.body.appendChild(measSvg);
const measCtx = document.createElement('canvas').getContext('2d');

/* Cadenas de referencia: mismo perfil de tinta que cualquier valor real. */
/* Extremos verticales que puede traer CUALQUIER idioma latino: mayúscula
   acentuada (Á y Õ suben por encima de la altura de caja), ascendentes,
   descendentes, dígitos y paréntesis. No es texto visible: es un patrón. */
const INK = 'ÁÕ1bdfhkl(gjpqy)';

/* Referencia métrica — NO es el texto real.
   La altura de cada franja se reserva midiendo ESTA cadena y no lo que va a
   imprimirse, para que todas las etiquetas midan lo mismo y se alineen en la
   página. Ahora que las descripciones se traducen, la referencia TIENE que
   ser independiente del idioma: si midiera el texto real, una etiqueta en
   portugués y una en inglés dejarían de tener la misma altura, y una revista
   que publica en dos lenguas las vería descuadradas uña junto a otra.
   Antes esto medía las cadenas inglesas fijas, que no llevaban acentos; con
   «EXTENSIÓN NO DECLARADA» o «Mais informações» eso se habría quedado corto
   por arriba. El título es la excepción: solo lleva códigos ASCII, así que se
   mide con su forma real. */
const REF = {
  title  : 'AI: N+',                    // versalitas, dos puntos, signo más
  details: INK,
  decl   : INK,
  tools  : INK,
  mi     : INK,
};

function widthOf(str, size, weight, ls){
  measText.setAttribute('font-family', FONT_FAMILY);
  measText.setAttribute('font-size', size);
  measText.setAttribute('font-weight', weight);
  measText.setAttribute('letter-spacing', ls||0);
  measText.textContent = str;
  return measText.getBBox().width;
}

function inkOf(refStr, size, weight){
  measCtx.font = weight + ' ' + size + 'px ' + FONT_FAMILY;
  const m = measCtx.measureText(refStr);
  const a = m.actualBoundingBoxAscent, d = m.actualBoundingBoxDescent;
  if(typeof a !== 'number' || !isFinite(a))          // navegador sin soporte
    return {ascent:size*0.72, descent:size*0.02, h:size*0.74};
  return {ascent:a, descent:Math.max(0,d), h:a+Math.max(0,d)};
}

/* =========================== 3. LAYOUT =================================
   Devuelve un objeto geométrico puro. Reglas:
   · El ancho lo manda el contenido, nunca al revés  -> no hay traslape.
   · El alto lo manda el ícono o la columna de texto, lo que sea mayor.
   · El bloque del QR se dimensiona DESPUÉS, a partir del alto ya resuelto,
     y su ancho es max(QR, "More info") + padding -> se ajusta al contenido.
   ====================================================================== */
/* Reparte la lista en renglones que caben en `maxW`, sin partir nunca una
   herramienta. Dos pasos:
   1. el reparto codicioso fija CUÁNTOS renglones hacen falta;
   2. entre todos los repartos con ese número de renglones se elige el que
      minimiza el renglón más largo. Así 6 herramientas quedan 2-2-2 y no
      2-3-1 con una huérfana al final. Con ≤6 elementos hay como mucho 10
      combinaciones: la búsqueda exhaustiva es instantánea. */
function packTools(items, maxW){
  if(!items.length) return [];
  const W = t => widthOf(t, D.toolsSize, D.toolsWeight, 0);
  const text = (grupo, primero) => (primero ? T.toolsLead : '') + grupo.join(BADGE.toolsSep);

  let n = 1, cur = [];
  items.forEach(it=>{
    const cand = [...cur, it];
    if(cur.length && W(text(cand, n===1)) > maxW){ n++; cur = [it]; }
    else cur = cand;
  });

  let best = null;
  const probar = grupos => {
    const lines = grupos.map((g,i)=>{ const t = text(g, i===0); return {t, w:W(t)}; });
    const peor = Math.max(...lines.map(l=>l.w));
    if(!best || peor < best.peor) best = {peor, lines};
  };
  const recorrer = (desde, quedan, acc) => {
    if(quedan===1){ probar([...acc, items.slice(desde)]); return; }
    for(let hasta = desde+1; hasta <= items.length-(quedan-1); hasta++)
      recorrer(hasta, quedan-1, [...acc, items.slice(desde, hasta)]);
  };
  recorrer(0, n, []);
  return best.lines;
}

function computeLayout(s, opts){
  const ax3 = (opts && opts.ax3) || 'none';
  const qrSafe = !opts || opts.qrSafe !== false;

  // alturas de tinta: contra referencias fijas -> alto constante del sistema
  const vDetails = inkOf(REF.details, D.detailsSize, D.detailsWeight);
  const vDecl    = inkOf(REF.decl,    D.declSize,    D.declWeight);
  const vMi      = inkOf(REF.mi,      D.miSize,      D.miWeight);

  const wDetails = widthOf(s.details, D.detailsSize, D.detailsWeight, 0);
  const wDecl    = widthOf(T.declaration, D.declSize, D.declWeight, D.declLS);
  const wMi      = widthOf(T.moreInfo, D.miSize, D.miWeight, 0);

  // -- título: encoge de a 2 pt si la cápsula se pasa de maxCardW ----------
  let titleSize = D.titleSize, wTitle, vTitle, colW, colLeft, colRight, shrunk = false;
  for(;;){
    wTitle = widthOf(s.title, titleSize, D.titleWeight, D.titleLS);
    vTitle = inkOf(REF.title, titleSize, D.titleWeight);
    colLeft  = Math.min(-D.dotR, wTitle/2 - wDecl/2);
    colRight = Math.max(wTitle + D.dotR, wTitle/2 + wDecl/2);
    if(wDetails > colRight - colLeft) colRight = colLeft + wDetails;  // DETAILS ensancha si hace falta
    colW = colRight - colLeft;
    if(D.cardPadX*2 + D.icon + D.iconGap + colW <= D.maxCardW || titleSize <= D.titleMin) break;
    titleSize -= 2; shrunk = true;
  }

  // -- alturas ------------------------------------------------------------
  // herramientas: renglones del ancho de la columna (con un mínimo, para que
  // una etiqueta de título corto no parta la lista en tiras)
  const toolLines = packTools(s.tools || [], Math.max(colW, D.toolsMinW));
  const wTools = toolLines.reduce((m,l)=>Math.max(m,l.w), 0);
  if(wTools > colW){ colRight = colLeft + wTools; colW = wTools; }
  const vTools = inkOf(REF.tools, D.toolsSize, D.toolsWeight);
  const toolsH = toolLines.length
    ? D.gapDetailsTools + toolLines.length*vTools.h + (toolLines.length-1)*D.toolsLineGap : 0;

  const blockH = vTitle.h + D.gapTitleRule + D.ruleW + D.gapRuleDecl + vDecl.h;
  const bandH  = (ax3==='band') ? D.ax3BandH + D.ax3Gap : 0;
  const contentH = vDetails.h + toolsH + D.gapDetailsBlock + blockH + bandH;

  const cardInnerH = Math.max(D.icon, contentH);
  const cardH = cardInnerH + D.cardPadY*2;
  const H = cardH + D.outPad*2;

  // -- anchos -------------------------------------------------------------
  const cardX = D.outPad, cardY = D.outPad;
  const cardW = D.cardPadX*2 + D.icon + D.iconGap + colW;

  // -- bloque QR: se dimensiona con el alto ya resuelto --------------------
  const qrOuter = Math.max(40, H - D.qrPad*2 - vMi.h - D.qrGap);
  const qrRegionW = Math.max(qrOuter, wMi) + D.qrPad*2;

  const stripW = (ax3==='strip') ? D.ax3StripW : 0;
  const W = cardX + cardW + stripW + qrRegionW;

  // -- posiciones ---------------------------------------------------------
  const innerX = cardX + D.cardPadX;
  const innerY = cardY + D.cardPadY;
  const iconX = innerX;
  const iconY = innerY + (cardInnerH - D.icon)/2;
  const titleX = innerX + D.icon + D.iconGap - colLeft;

  const detailsBaseline = innerY + vDetails.ascent;
  const detailsEndX = cardX + cardW - D.cardPadX;

  const toolsBaselines = toolLines.map((l,i)=> innerY + vDetails.h + D.gapDetailsTools
                                          + vTools.ascent + i*(vTools.h + D.toolsLineGap));
  const blockTop0 = innerY + vDetails.h + toolsH + D.gapDetailsBlock;
  const blockBot0 = innerY + cardInnerH - bandH;
  const blockTop  = blockTop0 + Math.max(0, (blockBot0 - blockTop0 - blockH)/2);

  const titleBaseline = blockTop + vTitle.ascent;
  const ruleY = blockTop + vTitle.h + D.gapTitleRule + D.ruleW/2;
  const declBaseline = blockTop + vTitle.h + D.gapTitleRule + D.ruleW + D.gapRuleDecl + vDecl.ascent;

  const qrRegionX = cardX + cardW + stripW;
  const qrOuterX = qrRegionX + (qrRegionW - qrOuter)/2;
  const qrOuterY = D.qrPad;
  const qrInset = qrSafe ? D.qrSafePad : 0;
  const miBaseline = qrOuterY + qrOuter + D.qrGap + vMi.ascent;
  const miCx = qrRegionX + qrRegionW/2;

  const ax3Zone = ax3==='band'
    ? {mode:'band', x:titleX + colLeft, y:innerY + cardInnerH - D.ax3BandH, w:colW, h:D.ax3BandH}
    : ax3==='strip'
      ? {mode:'strip', x:cardX + cardW + 5, y:D.outPad + 4, w:stripW - 10, h:H - D.outPad*2 - 8}
      : {mode:'none'};

  return {
    W, H, cardX, cardY, cardW, cardH, cardInnerH,
    iconX, iconY, iconSize:D.icon,
    titleX, titleBaseline, titleSize, titleW:wTitle, titleShrunk:shrunk,
    detailsEndX, detailsBaseline, detailsW:wDetails,
    toolLines, toolsBaselines,
    ruleY, ruleX0:titleX, ruleX1:titleX + wTitle,
    declBaseline, declCx:titleX + wTitle/2, declW:wDecl,
    qrRegionX, qrRegionW, qrOuter, qrOuterX, qrOuterY, qrInset,
    miBaseline, miCx, miW:wMi,
    ax3Zone, strings:s,
  };
}

/* ====================== ÍCONO DE MARCA (vectorial) =====================
   Sistema local 0–100, escalado al tamaño pedido: un solo juego de curvas
   que sirve igual a 24 px que a 4×.
   Lectura: anillo abierto (conocimiento en proceso, no cerrado) + eje
   vertical que parte el mismo cerebro en dos lecturas: izquierda orgánica
   (giros continuos, trazo modulado), derecha técnica (mismo contorno pero
   relleno de nodos y trazas ortogonales). No son dos objetos pegados: es
   un contorno espejado, que es justo el argumento del sistema —la misma
   autoría, dos naturalezas.
   ====================================================================== */
function f(n){ return Math.round(n*1000)/1000; }
function polar(cx,cy,r,deg){ const a=deg*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function arcPath(cx,cy,r,a0,a1){
  const [x0,y0]=polar(cx,cy,r,a0), [x1,y1]=polar(cx,cy,r,a1);
  const large = ((a1-a0)%360+360)%360 > 180 ? 1 : 0;
  return `M${f(x0)} ${f(y0)}A${f(r)} ${f(r)} 0 ${large} 1 ${f(x1)} ${f(y1)}`;
}

function brandIcon(size, color, detail, twoTone){
  const s = size/100;
  /* Coordenadas tomadas del PNG de marca (logo centrado en ~(960,950) con
     radio ~830 px) y normalizadas a un sistema 0–100 con centro en (50,50).
     No es un dibujo «parecido»: es el mismo trazado reconstruido en vector,
     porque el original es un raster generado y sus bordes son blandos —
     inservibles para imprimir a 4× o para recortar contra un fondo.

     Lecturas estructurales del original que hay que conservar:
     · el anillo se abre ARRIBA y ABAJO (no a los lados) y es BITONO;
     · el hemisferio izquierdo es un contorno CERRADO de lóbulos cuyo lado
       derecho es recto: ese lado recto ES la línea media;
     · el derecho NO tiene contorno: es una espina con ganchos arriba y
       abajo, de la que salen trazas hacia anillos huecos, más anillos
       sueltos sin conectar. Orgánico contenido / técnico disperso. */
  const ink  = color || '#1b2430';
  const gray = twoTone ? '#4a4b53' : ink;
  const small = (detail === 'simple') || (detail !== 'full' && size < 48);

  const SW = small
    ? {ring:4.4, lobe:4.2, spine:4.2, trace:3.8, node:3.4}
    : {ring:3.4, lobe:3.2, spine:3.2, trace:2.8, node:2.6};

  /* Hemisferio izquierdo: contorno cerrado. La Z final traza la recta
     vertical de vuelta al inicio, que es la línea media. */
  const lobe = 'M47 16'
             + 'C41 15 35.5 17.5 33.5 22.5'
             + 'C27.5 22 23 26.5 24 32'
             + 'C18.5 34.5 16 41 19 46'
             + 'C15 50.5 15.5 57.5 20 61'
             + 'C18 67 21.5 73.5 27.5 75'
             + 'C29 80 33.5 84.5 39.5 84'
             + 'C42 85.5 45 85.5 47 84'
             + 'Z';

  const dots  = [[39.2,36.4,4.2],[31,48.9,4.0],[38.6,61.9,4.0]];
  const rings = [[63.6,23.2,3.3],[57,37.3,3.0],[71.4,37.3,4.1],
                 [59.8,49.5,3.0],[73.8,54.3,3.8],[67.1,70.1,3.3]];

  const g = [];
  // anillo bitono, abierto arriba y abajo
  g.push(`<path d="${arcPath(50,50,45,95,265)}" fill="none" stroke="${ink}" stroke-width="${SW.ring}"/>`);
  g.push(`<path d="${arcPath(50,50,45,275,445)}" fill="none" stroke="${gray}" stroke-width="${SW.ring}"/>`);
  // hemisferio izquierdo
  g.push(`<path d="${lobe}" fill="none" stroke="${ink}" stroke-width="${SW.lobe}" stroke-linejoin="round"/>`);
  // espina derecha con gancho arriba y abajo
  g.push(`<path d="M60 18.2C55.5 18 52.2 21.5 52.2 28V72C52.2 78.5 55.5 82 60 81.8" fill="none" stroke="${ink}" stroke-width="${SW.spine}" stroke-linecap="round" stroke-linejoin="round"/>`);
  g.push(`<path d="M60 18.2L61.4 20.6" fill="none" stroke="${ink}" stroke-width="${SW.trace}" stroke-linecap="round"/>`);

  if(!small){
    g.push(`<path d="M39.2 36.4L31 48.9" fill="none" stroke="${ink}" stroke-width="${SW.trace}" stroke-linecap="round"/>`);
    g.push(`<path d="M38.6 61.9H47" fill="none" stroke="${ink}" stroke-width="${SW.trace}" stroke-linecap="round"/>`);
    dots.forEach(([x,y,r])=> g.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${ink}"/>`));
    g.push(`<path d="M52.2 60.3H59.8L64.2 67.6" fill="none" stroke="${ink}" stroke-width="${SW.trace}" stroke-linecap="round" stroke-linejoin="round"/>`);
    g.push(`<path d="M62.1 51.6L64.6 54" fill="none" stroke="${ink}" stroke-width="${SW.trace}" stroke-linecap="round"/>`);
    g.push(`<path d="M50.6 41.2H52.2" fill="none" stroke="${ink}" stroke-width="${SW.trace}" stroke-linecap="round"/>`);
    rings.forEach(([x,y,r])=> g.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${ink}" stroke-width="${SW.node}"/>`));
  }else{
    g.push(`<circle cx="39.2" cy="36.4" r="5" fill="${ink}"/>`);
    g.push(`<circle cx="36" cy="58" r="5" fill="${ink}"/>`);
    [[63.6,23.2,4.1],[71.4,37.3,4.9],[67.1,70.1,4.1]].forEach(([x,y,r])=>
      g.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${ink}" stroke-width="${SW.node}"/>`));
  }
  return `<g transform="scale(${f(s)})">${g.join('')}</g>`;
}

/* =========================== 4. RENDER ================================= */
function esc(s){
  // también comillas: el texto libre de las herramientas acaba dentro de aria-label="…"
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fontFaceCss(){
  if(!fonts.ready || !fonts.faces.length) return '';
  return fonts.faces.map(fc =>
    `@font-face{font-family:'Etiqueta Inter';font-style:normal;font-weight:${fc.weight};font-display:block;`
    + `src:url(data:font/woff2;base64,${fc.b64}) format('woff2');}`
  ).join('');
}

function renderSVG(L, qrHref, opts){
  const o = opts||{};
  const embed = o.embed !== false;
  const fg = D.fg, bg = D.bg;
  const defs = embed ? `<defs><style type="text/css">${fontFaceCss()}</style></defs>` : '';
  const FF = `font-family="${FONT_FAMILY}"`;

  // QR: placa blanca (estándar) o invertido (mockup). Van juntos en un
  // grupo porque son una sola pieza lógica.
  const qi = L.qrInset;
  const qrArt = `<g data-role="qr">`
    + (qi > 0 ? `<rect x="${f(L.qrOuterX)}" y="${f(L.qrOuterY)}" width="${f(L.qrOuter)}" height="${f(L.qrOuter)}" rx="6" fill="#ffffff"/>` : '')
    + `<image x="${f(L.qrOuterX+qi)}" y="${f(L.qrOuterY+qi)}" width="${f(L.qrOuter-qi*2)}" height="${f(L.qrOuter-qi*2)}" href="${qrHref}" preserveAspectRatio="none"/>`
    + `</g>`;

  const z = L.ax3Zone;
  const ax3Art = z.mode==='none' ? '' :
    `<g data-role="ax3" opacity="0.55">`
    + `<rect x="${f(z.x)}" y="${f(z.y)}" width="${f(z.w)}" height="${f(z.h)}" rx="6" fill="none" stroke="${z.mode==='strip'?'#ffffff':fg}" stroke-width="1.6" stroke-dasharray="5 4"/>`
    + (z.mode==='band'
        ? `<text x="${f(z.x + z.w/2)}" y="${f(z.y + z.h/2 + 3.5)}" text-anchor="middle" ${FF} font-size="10" font-weight="600" letter-spacing="1.2" fill="${fg}">EJE 3 · RESERVADO</text>`
        : '')
    + `</g>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${f(L.W)}" height="${f(L.H)}" viewBox="0 0 ${f(L.W)} ${f(L.H)}" role="img" aria-label="${esc(L.strings.title)} — ${esc(L.strings.details)}${(L.strings.tools||[]).length ? ' — '+esc(T.toolsLead+L.strings.tools.join('; ')) : ''}" text-rendering="geometricPrecision">
${defs}
<rect data-role="outer" x="0" y="0" width="${f(L.W)}" height="${f(L.H)}" rx="${D.rOut}" fill="${fg}"/>
<rect data-role="card" x="${f(L.cardX)}" y="${f(L.cardY)}" width="${f(L.cardW)}" height="${f(L.cardH)}" rx="${D.rCard}" fill="${bg}"/>
<g data-role="icon" transform="translate(${f(L.iconX)},${f(L.iconY)})">${brandIcon(L.iconSize, o.twoTone ? null : fg, null, o.twoTone)}</g>
<text data-role="details" x="${f(L.detailsEndX)}" y="${f(L.detailsBaseline)}" text-anchor="end" ${FF} font-size="${D.detailsSize}" font-weight="${D.detailsWeight}" fill="${fg}">${esc(L.strings.details)}</text>
${(L.toolLines||[]).map((l,k)=>`<text data-role="tools" x="${f(L.detailsEndX)}" y="${f(L.toolsBaselines[k])}" text-anchor="end" ${FF} font-size="${D.toolsSize}" font-weight="${D.toolsWeight}" fill="${fg}">${esc(l.t)}</text>`).join('')}
<text data-role="title" x="${f(L.titleX)}" y="${f(L.titleBaseline)}" ${FF} font-size="${f(L.titleSize)}" font-weight="${D.titleWeight}" letter-spacing="${D.titleLS}" fill="${fg}">${esc(L.strings.title)}</text>
<g data-role="rule"><line x1="${f(L.ruleX0)}" y1="${f(L.ruleY)}" x2="${f(L.ruleX1)}" y2="${f(L.ruleY)}" stroke="${fg}" stroke-width="${D.ruleW}" stroke-linecap="round"/><circle cx="${f(L.ruleX0)}" cy="${f(L.ruleY)}" r="${D.dotR}" fill="${fg}"/><circle cx="${f(L.ruleX1)}" cy="${f(L.ruleY)}" r="${D.dotR}" fill="${fg}"/></g>
<text data-role="decl" x="${f(L.declCx)}" y="${f(L.declBaseline)}" text-anchor="middle" ${FF} font-size="${D.declSize}" font-weight="${D.declWeight}" letter-spacing="${D.declLS}" fill="${fg}">${esc(T.declaration)}</text>
${qrArt}
<text data-role="moreinfo" x="${f(L.miCx)}" y="${f(L.miBaseline)}" text-anchor="middle" ${FF} font-size="${D.miSize}" font-weight="${D.miWeight}" fill="#ffffff">${esc(T.moreInfo)}</text>
${ax3Art}
</svg>`;
}

/* ============================ QR =======================================
   Nivel Q de corrección de errores (recupera ~25%): la etiqueta va a
   terminar impresa y fotocopiada, no solo en pantalla. Zona de silencio
   al 10% del lado, holgada a propósito: un QR pegado al borde del bloque
   negro no lo lee ni el mejor escáner.

   Todo esto puede fallar por razones ajenas al código (sin red -> QRious
   no cargó; URL larguísima -> no hay versión de QR que la codifique).
   En ese caso NO se rompe la etiqueta: se dibuja una placa vacía y se
   avisa. Una etiqueta sin QR es un problema; una app en blanco, dos.
   ====================================================================== */
let qrWarning = '';

/* Capacidad real del QR en modo byte, versión 40, corrección Q. Hace falta
   comprobarla A MANO: verificado en este navegador, QRious NO lanza error
   al pasarse — TRUNCA EN SILENCIO. Con 1663, 1700, 2000 y 3000 caracteres
   devuelve exactamente la misma imagen. O sea: una URL larga produciría un
   QR que escanea a una dirección cortada, sin ningún aviso. Un QR impreso
   es irreversible; eso no se puede dejar pasar. */
const QR_CAPACITY_Q = 1663;
/* Umbral de densidad para impresión: a ~25 mm de lado y con el piso
   práctico de 0.5 mm por módulo, caben unos 50 módulos -> versión 8–9 ->
   alrededor de 150 bytes en nivel Q. Más allá el QR sigue siendo válido
   pero deja de leerse bien en papel. */
const QR_PRINT_ADVISORY = 150;

function qrDataUrl(url, safe){
  qrWarning = '';
  const size = 520;
  const blank = (msg)=>{
    qrWarning = msg;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = safe ? '#ffffff' : D.fg;
    x.fillRect(0,0,size,size);
    x.strokeStyle = safe ? D.fg : '#ffffff';
    x.lineWidth = 6; x.setLineDash([14,12]);
    x.strokeRect(30,30,size-60,size-60);
    return c.toDataURL('image/png');
  };
  if(typeof QRious === 'undefined') return blank(U.qrNoLib);
  const bytes = new TextEncoder().encode(url).length;
  if(bytes > QR_CAPACITY_Q)
    return blank(U.qrTooLong(bytes, QR_CAPACITY_Q));
  try{
    const c = document.createElement('canvas');
    new QRious({
      element: c, value: url, size,
      padding: Math.round(size*0.10),
      level: 'Q',
      background: safe ? '#ffffff' : D.fg,
      foreground: safe ? D.fg : '#ffffff',
    });
    const data = c.toDataURL('image/png');
    if(bytes > QR_PRINT_ADVISORY)
      qrWarning = U.qrDense(bytes);
    return data;
  }catch(e){
    return blank(U.qrFail(e.message));
  }
}

/* ======================= TIPOGRAFÍA INCRUSTADA =========================
   Inter: grotesca neutra de altura-x alta y dígitos inequívocos. Importa
   porque lo que se lee acá es una CADENA DE CÓDIGO (AI:TR-ED-GE, niveles
   1–4), no prosa: hace falta que 1/l/I y 0/O no se confundan al tamaño
   chico del detalle. Se incrusta en el SVG para que el archivo exportado
   no dependa de las fuentes de quien lo abra.
   ====================================================================== */
const FONT_URLS = [
  {weight:500, url:'https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/files/inter-latin-500-normal.woff2'},
  {weight:600, url:'https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/files/inter-latin-600-normal.woff2'},
  {weight:700, url:'https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/files/inter-latin-700-normal.woff2'},
];

function b64(bytes){
  let s=''; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(s);
}

async function loadFonts(){
  const note = document.getElementById('fontNote');
  try{
    const res = await Promise.all(FONT_URLS.map(async fu=>{
      const r = await fetch(fu.url, {mode:'cors'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return {weight:fu.weight, b64:b64(new Uint8Array(await r.arrayBuffer()))};
    }));
    fonts.faces = res;
    const st = document.createElement('style');
    st.textContent = fontFaceCssFrom(res);
    document.head.appendChild(st);
    await Promise.all(res.map(fc=>document.fonts.load(`${fc.weight} 40px 'Etiqueta Inter'`)));
    await document.fonts.ready;
    fonts.ready = true;
    fontState = {kind:'ok', kb: Math.round(res.reduce((a,b)=>a+b.b64.length,0)/1024)};
    note.textContent = U.fontOk(fontState.kb);
  }catch(e){
    fonts.ready = false;
    fontState = {kind:'fail', kb:0};
    note.textContent = U.fontFail;
  }
  render();
}
function fontFaceCssFrom(faces){
  return faces.map(fc=>`@font-face{font-family:'Etiqueta Inter';font-style:normal;font-weight:${fc.weight};font-display:block;src:url(data:font/woff2;base64,${fc.b64}) format('woff2');}`).join('');
}

                  + `<span class="desc">${t[lang]}</span></label>`;

    }

    const label = document.createElement('label');
    label.setAttribute('for', cb.id);
    const stm = t.stm
      /* El estado va VISIBLE junto al número, para no depender del cursor:
         la actividad 1 lleva su etiqueta de umbral igual que la 9 la suya. */
      ? `<span class="stm" data-tip="${esc(U.tipStm(t.stm))}" data-tip-sub="${esc(t.stmNote ? t.stmNote[lang] : (t.scopeNote ? t.scopeNote[lang] : U.tipStmSub))}">STM ${t.stm}${t.tag?` <span class="tag">${esc(U[t.tag])}</span>`:(t.stmNote?' *':(t.scopeNote?' †':''))}</span>`
      : `<span class="stm" data-tip="${esc(U.tipNoStm)}" data-tip-sub="${esc(U.tipNoStmSub)}">—</span>`;
    /* La guía va sobre las LETRAS. El chip STM lleva la suya y queda dentro
       de este span: `closest('[data-tip]')` resuelve al más interno, así que
       cada mitad muestra lo suyo sin estorbarse. */
    label.innerHTML = `<span class="code" data-tip="${esc(t.code + ' · ' + fromLabel(t))}" data-tip-sub="${esc(U.tipCodeSub)}">${t.code} ${stm}</span>`
                    + `<span class="desc">${esc(t[lang])}${t.eg?`<small class="eg">${esc(t.eg[lang])}</small>`:''}</span>`;
    row.append(cb, label);

    if(!t.exclusive){
      /* Eje 2 OPCIONAL (§4.2): «—» es el valor por defecto y significa
         extensión no declarada. La versión anterior forzaba :1 al marcar,
         o sea inventaba una declaración de «menos de un cuarto» que la
         persona autora nunca hizo. */
      const levels = document.createElement('div');
      levels.className='levels';
      [0,1,2,3,4].forEach(lv=>{
        const b = document.createElement('button');
        const E = EXTENTS[lv];
        b.type='button';
        b.textContent = lv===0 ? '—' : lv;
        const head = lv===0 ? U.tipNotDecl : `${lv} · ${E[lang]}`;
        const sub  = lv===0 ? U.tipNotDeclSub(t.code) : U.tipExtentSub(refOf(lv), t.unit && t.unit[lang]);
        b.setAttribute('data-tip', head);
        b.setAttribute('data-tip-sub', sub);
        b.setAttribute('aria-label', `${head}. ${sub}`);
        b.classList.toggle('active', (state[t.code]||0)===lv);
        b.addEventListener('click', ()=>{
          if(!(t.code in state)) return;
          state[t.code]=lv; buildControls(); render();
        });
        levels.appendChild(b);
      });
      row.appendChild(levels);
    }
    taskListEl.appendChild(row);
  });

  // leyenda de la escala, siempre a la vista
  const leg = document.createElement('div');
  leg.className = 'legend';
  leg.innerHTML = `<span class="lt">${U.legendTitle}</span>`
    + [0,1,2,3,4].map(lv=>{
        const E = EXTENTS[lv];
        const head = lv===0 ? U.tipNotDecl : `${lv} · ${E[lang]}`;
        const sub  = lv===0 ? U.tipNotDeclSub('ED') : U.tipExtentSub(refOf(lv));
        const short = lv===0 ? U.legendNotDecl : E[lang].split(':')[0].toLowerCase();
        return `<span class="li" tabindex="0" data-tip="${esc(head)}" data-tip-sub="${esc(sub)}">`
             + `<b>${lv===0?'—':lv}</b>${short}</span>`;
      }).join('');
  taskListEl.appendChild(leg);
}

function buildTools(){

      inp.addEventListener('input', ()=>{ r[key] = inp.value; render(); });

    row.append(mk('name', D.toolNameMax, U.phToolName), mk('model', D.toolModelMax, U.phToolModel), rm);

function onToggle(code, checked){

  buildControls(); buildTools(); render();
}
