function esc(s){
  // también comillas: el texto libre de las herramientas acaba dentro de aria-label="…"
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fontFaceCss(){
  if(!fonts.ready || !fonts.faces.length) return '';
  return fonts.faces.map(fc =>
    `@font-face{font-family:'Etiqueta Inter';font-style:normal;font-weight:${fc.weight};font-display:block;`
    + `src:url(data:font/woff2;base64,${fc.b64}) format('woff2');}`
  ).join('');
}

function renderSVG(L, qrHref, opts){
  const o = opts||{};
  const embed = o.embed !== false;
  const fg = D.fg, bg = D.bg;
  const defs = embed ? `<defs><style type="text/css">${fontFaceCss()}</style></defs>` : '';
  const FF = `font-family="${FONT_FAMILY}"`;

  // QR: placa blanca (estándar) o invertido (mockup). Van juntos en un
  // grupo porque son una sola pieza lógica.
  const qi = L.qrInset;
  const qrArt = `<g data-role="qr">`
    + (qi > 0 ? `<rect x="${f(L.qrOuterX)}" y="${f(L.qrOuterY)}" width="${f(L.qrOuter)}" height="${f(L.qrOuter)}" rx="6" fill="#ffffff"/>` : '')
    + `<image x="${f(L.qrOuterX+qi)}" y="${f(L.qrOuterY+qi)}" width="${f(L.qrOuter-qi*2)}" height="${f(L.qrOuter-qi*2)}" href="${qrHref}" preserveAspectRatio="none"/>`
    + `</g>`;

  const z = L.ax3Zone;
  const ax3Art = z.mode==='none' ? '' :
    `<g data-role="ax3" opacity="0.55">`
    + `<rect x="${f(z.x)}" y="${f(z.y)}" width="${f(z.w)}" height="${f(z.h)}" rx="6" fill="none" stroke="${z.mode==='strip'?'#ffffff':fg}" stroke-width="1.6" stroke-dasharray="5 4"/>`
    + (z.mode==='band'
        ? `<text x="${f(z.x + z.w/2)}" y="${f(z.y + z.h/2 + 3.5)}" text-anchor="middle" ${FF} font-size="10" font-weight="600" letter-spacing="1.2" fill="${fg}">EJE 3 · RESERVADO</text>`
        : '')
    + `</g>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${f(L.W)}" height="${f(L.H)}" viewBox="0 0 ${f(L.W)} ${f(L.H)}" role="img" aria-label="${esc(L.strings.title)} — ${esc(L.strings.details)}${(L.strings.tools||[]).length ? ' — '+esc(T.toolsLead+L.strings.tools.join('; ')) : ''}" text-rendering="geometricPrecision">
${defs}
<rect data-role="outer" x="0" y="0" width="${f(L.W)}" height="${f(L.H)}" rx="${D.rOut}" fill="${fg}"/>
<rect data-role="card" x="${f(L.cardX)}" y="${f(L.cardY)}" width="${f(L.cardW)}" height="${f(L.cardH)}" rx="${D.rCard}" fill="${bg}"/>
<g data-role="icon" transform="translate(${f(L.iconX)},${f(L.iconY)})">${brandIcon(L.iconSize, fg)}</g>
<g data-role="system"><text x="${f(L.sysCx)}" y="${f(L.sysNameBase)}" ${FF} font-size="${f(L.sysNameSize)}" font-weight="700" letter-spacing="0.05" text-anchor="middle" fill="${fg}">${esc(L.sysName)}</text>${L.sysDescLines.map((t,i)=>`<text x="${f(L.sysCx)}" y="${f(L.sysDescBase + i*L.sysDescLead)}" ${FF} font-size="${f(L.sysDescSize)}" font-weight="${D.sysDescWeight}" letter-spacing="0.2" text-anchor="middle" fill="${fg}">${esc(t)}</text>`).join('')}</g>
<text data-role="details" x="${f(L.detailsEndX)}" y="${f(L.detailsBaseline)}" text-anchor="end" ${FF} font-size="${L.strings.noExtent ? D.noExtentSize : D.detailsSize}" font-weight="${D.detailsWeight}" fill="${fg}">${esc(L.strings.details)}</text>
${(L.toolLines||[]).map((l,k)=>`<text data-role="tools" x="${f(L.detailsEndX)}" y="${f(L.toolsBaselines[k])}" text-anchor="end" ${FF} font-size="${D.toolsSize}" font-weight="${D.toolsWeight}" fill="${fg}">${esc(l.t)}</text>`).join('')}
<text data-role="title" x="${f(L.titleX)}" y="${f(L.titleBaseline)}" ${FF} font-size="${f(L.titleSize)}" font-weight="${D.titleWeight}" letter-spacing="${D.titleLS}" fill="${fg}">${esc(L.strings.title)}</text>
<g data-role="rule"><line x1="${f(L.ruleX0)}" y1="${f(L.ruleY)}" x2="${f(L.ruleX1)}" y2="${f(L.ruleY)}" stroke="${fg}" stroke-width="${D.ruleW}" stroke-linecap="round"/><circle cx="${f(L.ruleX0)}" cy="${f(L.ruleY)}" r="${D.dotR}" fill="${fg}"/><circle cx="${f(L.ruleX1)}" cy="${f(L.ruleY)}" r="${D.dotR}" fill="${fg}"/></g>
<text data-role="decl" x="${f(L.declCx)}" y="${f(L.declBaseline)}" text-anchor="middle" ${FF} font-size="${D.declSize}" font-weight="${D.declWeight}" letter-spacing="${D.declLS}" fill="${fg}">${esc(T.declaration)}</text>
${qrArt}
<text data-role="moreinfo" x="${f(L.miCx)}" y="${f(L.miBaseline)}" text-anchor="middle" ${FF} font-size="${D.miSize}" font-weight="${D.miWeight}" fill="#ffffff">${esc(T.moreInfo)}</text>
${ax3Art}
</svg>`;
}

/* ============================ QR =======================================
   Nivel Q de corrección de errores (recupera ~25%): la etiqueta va a
   terminar impresa y fotocopiada, no solo en pantalla. Zona de silencio
   al 10% del lado, holgada a propósito: un QR pegado al borde del bloque
   negro no lo lee ni el mejor escáner.

   Todo esto puede fallar por razones ajenas al código (sin red -> QRious
   no cargó; URL larguísima -> no hay versión de QR que la codifique).
   En ese caso NO se rompe la etiqueta: se dibuja una placa vacía y se
   avisa. Una etiqueta sin QR es un problema; una app en blanco, dos.
   ====================================================================== */
let qrWarning = '';

/* Capacidad real del QR en modo byte, versión 40, corrección Q. Hace falta
   comprobarla A MANO: verificado en este navegador, QRious NO lanza error
   al pasarse — TRUNCA EN SILENCIO. Con 1663, 1700, 2000 y 3000 caracteres
   devuelve exactamente la misma imagen. O sea: una URL larga produciría un
   QR que escanea a una dirección cortada, sin ningún aviso. Un QR impreso
   es irreversible; eso no se puede dejar pasar. */
const QR_CAPACITY_Q = 1663;
/* Umbral de densidad para impresión: a ~25 mm de lado y con el piso
   práctico de 0.5 mm por módulo, caben unos 50 módulos -> versión 8–9 ->
   alrededor de 150 bytes en nivel Q. Más allá el QR sigue siendo válido
   pero deja de leerse bien en papel. */
const QR_PRINT_ADVISORY = 150;

function qrDataUrl(url, safe){
  qrWarning = '';
  const size = 520;
  const blank = (msg)=>{
    qrWarning = msg;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = safe ? '#ffffff' : D.fg;
    x.fillRect(0,0,size,size);
    x.strokeStyle = safe ? D.fg : '#ffffff';
    x.lineWidth = 6; x.setLineDash([14,12]);
    x.strokeRect(30,30,size-60,size-60);
    return c.toDataURL('image/png');
  };
  if(typeof QRious === 'undefined') return blank(U.qrNoLib);
  const bytes = new TextEncoder().encode(url).length;
  if(bytes > QR_CAPACITY_Q)
    return blank(U.qrTooLong(bytes, QR_CAPACITY_Q));
  try{
    const c = document.createElement('canvas');
    new QRious({
      element: c, value: url, size,
      padding: Math.round(size*0.10),
      level: 'Q',
      background: safe ? '#ffffff' : D.fg,
      foreground: safe ? D.fg : '#ffffff',
    });
    const data = c.toDataURL('image/png');
    if(bytes > QR_PRINT_ADVISORY)
      qrWarning = U.qrDense(bytes);
    return data;
  }catch(e){
    return blank(U.qrFail(e.message));
  }
}

/* ======================= TIPOGRAFÍA INCRUSTADA =========================
   Inter: grotesca neutra de altura-x alta y dígitos inequívocos. Importa
   porque lo que se lee acá es una CADENA DE CÓDIGO (AI:TR-ED-GE, niveles
   1–4), no prosa: hace falta que 1/l/I y 0/O no se confundan al tamaño
   chico del detalle. Se incrusta en el SVG para que el archivo exportado
   no dependa de las fuentes de quien lo abra.
   ====================================================================== */
const FONT_URLS = [
  {weight:500, url:'https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/files/inter-latin-500-normal.woff2'},
  {weight:600, url:'https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/files/inter-latin-600-normal.woff2'},
  {weight:700, url:'https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/files/inter-latin-700-normal.woff2'},
];

function b64(bytes){
  let s=''; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(s);
}

async function loadFonts(){
  const note = document.getElementById('fontNote');
  try{
    const res = await Promise.all(FONT_URLS.map(async fu=>{
      const r = await fetch(fu.url, {mode:'cors'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return {weight:fu.weight, b64:b64(new Uint8Array(await r.arrayBuffer()))};
    }));
    fonts.faces = res;
    const st = document.createElement('style');
    st.textContent = fontFaceCssFrom(res);
    document.head.appendChild(st);
    await Promise.all(res.map(fc=>document.fonts.load(`${fc.weight} 40px 'Etiqueta Inter'`)));
    await document.fonts.ready;
    fonts.ready = true;
    fontState = {kind:'ok', kb: Math.round(res.reduce((a,b)=>a+b.b64.length,0)/1024)};
    note.textContent = U.fontOk(fontState.kb);
  }catch(e){
    fonts.ready = false;
    fontState = {kind:'fail', kb:0};
    note.textContent = U.fontFail;
  }
  render();
}
function fontFaceCssFrom(faces){
  return faces.map(fc=>`@font-face{font-family:'Etiqueta Inter';font-style:normal;font-weight:${fc.weight};font-display:block;src:url(data:font/woff2;base64,${fc.b64}) format('woff2');}`).join('');
}

    label.innerHTML = `<span class="code" data-tip="${esc(t.code + ' · ' + fromLabel(t))}" data-tip-sub="${esc(U.tipCodeSub)}">${t.code} ${stm}</span>`

      const levels = document.createElement('div');

      [0,1,2,3,4].forEach(lv=>{

        b.type='button';
        /* Antes acá iba un guion. Una estudiante lo encontró confuso y tenía
           razón: es un símbolo que hay que aprender, y puesto en fila con los
           números se lee como «nivel cero», que es lo que significa N, no
           esto. La palabra lo dice sola. En la etiqueta impresa nunca hubo
           guion: ahí sale «EXTENSIÓN NO DECLARADA» con todas las letras. */
        b.textContent = lv===0 ? U.lvOmit : lv;
        const head = lv===0 ? U.tipNotDecl : `${lv} · ${E[lang]}`;
        const sub  = lv===0 ? U.tipNotDeclSub : U.tipExtentSub(refOf(lv), t.unit && t.unit[lang]);
        b.setAttribute('data-tip', head);
        b.setAttribute('data-tip-sub', sub);
        b.setAttribute('aria-label', `${head}. ${sub}`);
        b.classList.toggle('active', (state[t.code]||0)===lv);
        b.addEventListener('click', ()=>{
          if(!(t.code in state)) return;
          state[t.code]=lv; buildControls(); render();
        });
        levels.appendChild(b);
      });
      row.appendChild(levels);
    }
    taskListEl.appendChild(row);
  });

  // leyenda de la escala, siempre a la vista
  const leg = document.createElement('div');
  leg.className = 'legend';
  leg.innerHTML = `<span class="lt">${U.legendTitle}</span>`
    + [0,1,2,3,4].map(lv=>{
        const E = EXTENTS[lv];
        const head = lv===0 ? U.tipNotDecl : `${lv} · ${E[lang]}`;
        const sub  = lv===0 ? U.tipNotDeclSub : U.tipExtentSub(refOf(lv));
        const short = lv===0 ? U.legendNotDecl : E[lang].split(':')[0].toLowerCase();
        return `<span class="li" tabindex="0" data-tip="${esc(head)}" data-tip-sub="${esc(sub)}">`
             + `<b class="${lv===0?'wd':''}">${lv===0?esc(U.lvOmit):lv}</b>${short}</span>`;
      }).join('');
  /* Cierra el recuadro en la última fila que de verdad tiene niveles: la
     última del bloque es la actividad 9, que no los lleva, así que un
     :last-of-type en CSS dejaba el borde abierto por abajo. */
  { const conNiveles = taskListEl.querySelectorAll('.levels');
    if(conNiveles.length){
      conNiveles[conNiveles.length-1].classList.add('fin');
      /* La tapa del recuadro, justo encima de la primera fila con niveles. */
      const h = document.createElement('div');
      h.className = 'lvhead';
      h.innerHTML = `<span class="sp">${esc(U.colExtentLead)}</span>`
                  + `<span class="cap">${esc(U.colExtent)}<i>${esc(U.colOptional)}</i></span>`;
      const primera = conNiveles[0].closest('.task-row');
      primera.parentNode.insertBefore(h, primera);
    } }
  taskListEl.appendChild(leg);
}

/* Filas de herramientas. Se reconstruyen al agregar/quitar y al cambiar de
   idioma, pero NO en cada tecla: si no, el campo perdería el foco. */
function buildTools(){
  const box = $('toolList');
  box.innerHTML = '';
  /* Un solo datalist para todas las filas: se llena una vez y cada campo de
     nombre lo referencia por id. */
  const dl = $('toolNames');
  if(dl && !dl.children.length)
    dl.innerHTML = TOOL_SUGGESTIONS.map(t=>`<option value="${esc(t)}"></option>`).join('');
  const off = !!state.N;                                     // con «sin uso» no hay herramientas que declarar
  toolRows.forEach((r,i)=>{
    const row = document.createElement('div');
    row.className = 'tool-row';
    const mk = (key, max, ph) => {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.maxLength = max; inp.value = r[key];
      inp.placeholder = ph; inp.setAttribute('aria-label', ph); inp.disabled = off;
      /* Solo el nombre lleva sugerencias. El modelo no: cambia cada pocos
         meses y sería lo primero en quedar desfasado. */
      if(key === 'name'){ inp.setAttribute('list', 'toolNames'); inp.autocomplete = 'off'; }
      inp.addEventListener('input', ()=>{ r[key] = inp.value; render(); });
      return inp;
    };
    const rm = document.createElement('button');
    rm.type='button'; rm.className='rm'; rm.textContent='×'; rm.disabled = off;
    rm.title = U.rmTool; rm.setAttribute('aria-label', U.rmTool);
    rm.addEventListener('click', ()=>{ toolRows.splice(i,1); buildTools(); render(); });
    row.append(mk('name', D.toolNameMax, U.phToolName), mk('model', D.toolModelMax, U.phToolModel), rm);
    box.appendChild(row);
  });
  $('btnAddTool').disabled = off || toolRows.length >= D.toolsMax;
  $('toolsBox').classList.toggle('off', off);
}

function onToggle(code, checked){
  if(code==='N'){
    state = checked ? {N:true} : {};
  }else{
    if(checked){ delete state.N; state[code]=0; }   // 0 = extensión no declarada
    else delete state[code];
  }
  buildControls(); buildTools(); render();
}

/* ========================= EXPORTACIÓN ================================= */
function svgToDataUri(svg){
  return 'data:image/svg+xml;base64,' + b64(new TextEncoder().encode(svg));
}
function download(href, name){
  const a = document.createElement('a');
  a.href = href; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

$('btnSvg').addEventListener('click', ()=>{
  if(!current.svg) return;
  // Blob y no data: URI — con la tipografía incrustada el archivo pasa de
  // 100 KB y algunos navegadores cortan las descargas data: largas.
  const u = URL.createObjectURL(new Blob([current.svg], {type:'image/svg+xml;charset=utf-8'}));
  download(u, `${current.name}.svg`);
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
});

function renderPng(svg, L, scale){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement('canvas');
      cv.width = Math.round(L.W*scale);
      cv.height = Math.round(L.H*scale);
      const ctx = cv.getContext('2d');
      ctx.setTransform(scale,0,0,scale,0,0);
      ctx.drawImage(img, 0, 0, L.W, L.H);
      resolve(cv);
    };
    img.onerror = ()=>reject(new Error('el SVG no se pudo rasterizar'));
    img.src = svgToDataUri(svg);
  });
}

$('btnPng').addEventListener('click', async ()=>{
  if(!current.svg) return;
  const scale = parseInt($('pngScale').value,10);
  try{
    const cv = await renderPng(current.svg, current.L, scale);
    cv.toBlob(b=>{
      const u = URL.createObjectURL(b);
      download(u, `${current.name}@${scale}x.png`);
      setTimeout(()=>URL.revokeObjectURL(u), 4000);
    });
  }catch(e){ alert(U.pngFail(e.message)); }
});

/* ============================ PRUEBAS ==================================
   ARNÉS DE DESARROLLO. No tiene interfaz: se ejecuta desde la consola con
       window.__app.runSelfTest()
   y escribe el resultado ahí. Se conserva dentro del archivo a propósito —
   es HTML único, no hay dónde más ponerlo, y sin él cualquier cambio futuro
   viajaría sin verificar. No se ejecuta solo, así que no afecta en nada a
   quien abre la página.
   ======================================================================
   No son decorativas: montan el SVG en el DOM y miden CAJAS DE TINTA
   reales (no cajas de fuente, que llevan aire arriba y abajo y darían
   falsos positivos). Lo que se verifica es lo que se ve.
   Además no basta con "no se tocan": se exige HOLGURA MÍNIMA, porque dos
   elementos a 0.3 unidades no se traslapan pero se ven pegados.
   ====================================================================== */
const MIN_CLEARANCE = 3;   // unidades SVG de aire exigidas entre piezas

/* Caja absoluta (en unidades del lienzo) de cualquier elemento. getBBox()
   devuelve coordenadas del espacio local; hay que pasarlas por la CTM. */
function absBox(el){
  const b = el.getBBox();
  const m = el.getCTM();
  if(!m) return {x:b.x, y:b.y, width:b.width, height:b.height};
  const pts = [[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]]
    .map(([x,y])=>({x:m.a*x+m.c*y+m.e, y:m.b*x+m.d*y+m.f}));
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  return {x:Math.min(...xs), y:Math.min(...ys), width:Math.max(...xs)-Math.min(...xs), height:Math.max(...ys)-Math.min(...ys)};
}

/* Caja de TINTA de un <text>: ancho por getBBox (avance real, con
   letter-spacing), alto por canvas.actualBoundingBox* sobre su cadena. */
function inkBox(el){
  const b = absBox(el);
  const size = parseFloat(el.getAttribute('font-size'));
  const weight = el.getAttribute('font-weight') || 400;
  const ink = inkOf(el.textContent, size, weight);
  const baseline = parseFloat(el.getAttribute('y'));
  return {x:b.x, width:b.width, y:baseline - ink.ascent, height:ink.h};
}

function unionBox(a,b){
  const x=Math.min(a.x,b.x), y=Math.min(a.y,b.y);
  return {x, y, width:Math.max(a.x+a.width, b.x+b.width)-x, height:Math.max(a.y+a.height, b.y+b.height)-y};
}
function inspect(svgString){
  const holder = document.createElement('div');
  Object.assign(holder.style,{position:'absolute',left:'-20000px',top:'0'});
  holder.innerHTML = svgString;
  document.body.appendChild(holder);
  const svg = holder.querySelector('svg');
  const out = {};
  svg.querySelectorAll('[data-role]').forEach(el=>{
    const role = el.getAttribute('data-role');
    const box = (el.tagName.toLowerCase()==='text') ? inkBox(el) : absBox(el);
    out[role] = out[role] ? unionBox(out[role], box) : box;   // p. ej. varios renglones de herramientas
  });
  holder.remove();
  return out;
}

function gap(a,b){                       // separación mínima; <0 = traslape
  const dx = Math.max(a.x - (b.x+b.width), b.x - (a.x+a.width));
  const dy = Math.max(a.y - (b.y+b.height), b.y - (a.y+a.height));
  return Math.max(dx, dy);
}
function inside(inner, outer, tol){
  tol = tol||0.5;
  return inner.x >= outer.x-tol && inner.y >= outer.y-tol
      && inner.x+inner.width  <= outer.x+outer.width +tol
      && inner.y+inner.height <= outer.y+outer.height+tol;
}

function runSelfTest(){
  const log = [];
  let pass=0, fail=0, tightest={g:1e9, what:''};
  const ok = (c,msg)=>{ c?pass++:fail++; log.push(`<span class="${c?'p':'f'}">${c?'OK  ':'FAIL'}</span> ${msg}`); };
  /* Omitir NO es aprobar: se cuenta aparte y se ve en el registro. Hace falta
     porque hay pruebas que dependen del CDN y la app promete funcionar sin
     conexión — si la batería se cae ahí, deja de cubrir justo ese escenario. */
  let skipped = 0;
  const skip = msg =>{ skipped++; log.push(`<span class="s">OMIT</span> ${msg}`); };
  const hayQR = typeof QRious !== 'undefined';

  const saved = JSON.parse(JSON.stringify(state));
  const savedTools = JSON.parse(JSON.stringify(toolRows));
  toolRows = [];

  // universo de casos
  const cases = [{N:true}];
  ORDER.forEach(c=>cases.push({[c]:0}));                           // cada código, sin extensión
  ORDER.forEach(c=>cases.push({[c]:4}));                           // cada código, extensión máxima
  cases.push({ED:1, TR:3, RF:2});                                  // el ejemplo del §4.4
  cases.push({ED:0, TR:0, RF:0});                                  // varios sin extensión
  cases.push({ED:2, TG:0, TR:4});                                  // mezcla declarada / no declarada
  cases.push(Object.fromEntries(ORDER.map((c,i)=>[c,i%5])));       // los 8, mezclado
  cases.push(Object.fromEntries(ORDER.map(c=>[c,4])));             // los 8, todos en 4
  cases.push(Object.fromEntries(ORDER.map(c=>[c,0])));             // los 8, ninguno declarado
  const modes = ['none','band','strip'];
  const qrModes = [true,false];

  // piezas que deben respetar holgura entre sí
  const PIECES = ['icon','details','tools','title','rule','decl','qr','moreinfo'];
  let heights = new Set();

  cases.forEach(cs=>{
    state = cs;
    const s = badgeStrings();
    modes.forEach(mode=>{
      qrModes.forEach(qrSafe=>{
        const opts = {ax3:mode, qrSafe, embed:false};
        const L = computeLayout(s, opts);
        const svg = renderSVG(L, qrDataUrl('https://investiga.uned.ac.cr/cienciaabierta', qrSafe), opts);
        const tag = `${s.title} [${mode}/${qrSafe?'qr-std':'qr-inv'}]`;
        const R = inspect(svg);
        if(mode==='none' && qrSafe) heights.add(Math.round(L.H));

        // 1. holgura mínima entre todas las piezas
        let worst = {g:1e9, what:''};
        for(let i=0;i<PIECES.length;i++)
          for(let j=i+1;j<PIECES.length;j++){
            const A=R[PIECES[i]], B=R[PIECES[j]];
            if(!A||!B) continue;
            const d = gap(A,B);
            if(d < worst.g) worst = {g:d, what:`${PIECES[i]}↔${PIECES[j]}`};
          }
        if(worst.g < tightest.g) tightest = {g:worst.g, what:`${tag} ${worst.what}`};
        ok(worst.g >= MIN_CLEARANCE, `${tag} — holgura mínima ${worst.g.toFixed(1)}u en ${worst.what} (exigido ${MIN_CLEARANCE})`);

        // 2. lo de la cápsula, dentro de la cápsula
        const esc2 = ['icon','details','tools','title','rule','decl'].filter(k=>R[k] && !inside(R[k], R.card));
        ok(esc2.length===0, `${tag} — contenido dentro de la cápsula${esc2.length?': se sale '+esc2.join(', '):''}`);

        // 3. el bloque QR, fuera de la cápsula y dentro del lienzo
        ok(R.qr.x >= R.card.x + R.card.width - 0.5, `${tag} — QR fuera de la cápsula`);
        ok(inside(R.qr, R.outer) && inside(R.moreinfo, R.outer), `${tag} — bloque QR dentro del lienzo`);
        ok(R.moreinfo.x >= L.qrRegionX-0.5 && R.moreinfo.x+R.moreinfo.width <= L.qrRegionX+L.qrRegionW+0.5,
           `${tag} — «More info» dentro de su bloque`);

        // 4. nada se sale del lienzo
        const fuera = Object.keys(R).filter(k=>k!=='outer' && !inside(R[k], R.outer));
        ok(fuera.length===0, `${tag} — nada se sale del lienzo${fuera.length?': '+fuera.join(', '):''}`);

        // 5. la zona del Eje 3 no pisa ninguna pieza
        if(mode!=='none'){
          const choques = PIECES.filter(k=>R[k] && gap(R[k], R.ax3) < 0);
          ok(choques.length===0, `${tag} — zona Eje 3 libre${choques.length?': choca con '+choques.join(', '):''}`);
        }

        // 6. XML bien formado
        const doc = new DOMParser().parseFromString(svg,'image/svg+xml');
        ok(!doc.querySelector('parsererror'), `${tag} — SVG bien formado`);
      });
    });
  });

  /* 6bis. HERRAMIENTAS. Texto libre del usuario que entra en la etiqueta:
     puede ser largo, múltiple o traer caracteres que rompen el XML. */
  const toolSets = [
    {nom:'una', rows:[{name:'ChatGPT', model:'GPT-5'}]},
    {nom:'tres', rows:[{name:'ChatGPT', model:'GPT-5'},{name:'DeepL Pro', model:''},{name:'Grammarly', model:''}]},
    {nom:'seis al máximo', rows:Array.from({length:6},(_,i)=>({
        name:('Herramienta'+i+'xxxxxxxxxxxxxxxxxxxx').slice(0,30),
        model:('Modelo-'+i+'-yyyyyyyyyyyyyyyyyyyyyy').slice(0,30)}))},
    {nom:'caracteres peligrosos', rows:[{name:'A<b>&"c\'d', model:'x"y<z'}]},
  ];
  const toolCases = [{ED:0}, {ED:1,TR:3,RF:2}, Object.fromEntries(ORDER.map(c=>[c,4]))];
  toolSets.forEach(ts=>{
    toolRows = ts.rows;
    toolCases.forEach(cs=>{
      state = cs;
      ['none','band'].forEach(mode=>{
        const opts = {ax3:mode, qrSafe:true, embed:false};
        const s2 = badgeStrings();
        const L = computeLayout(s2, opts);
        const svg = renderSVG(L, qrDataUrl('https://investiga.uned.ac.cr/cienciaabierta', true), opts);
        const tag = `herramientas «${ts.nom}» · ${s2.title} [${mode}]`;
        const doc = new DOMParser().parseFromString(svg,'image/svg+xml');
        ok(!doc.querySelector('parsererror'), `${tag} — SVG bien formado`);
        const R = inspect(svg);
        let worst = {g:1e9, what:''};
        for(let i=0;i<PIECES.length;i++) for(let j=i+1;j<PIECES.length;j++){
          const A=R[PIECES[i]], B=R[PIECES[j]]; if(!A||!B) continue;
          const d=gap(A,B); if(d<worst.g) worst={g:d, what:`${PIECES[i]}↔${PIECES[j]}`};
        }
        ok(worst.g >= MIN_CLEARANCE, `${tag} — holgura ${worst.g.toFixed(1)}u en ${worst.what}`);
        ok(R.tools && inside(R.tools, R.card), `${tag} — las herramientas caben dentro de la cápsula`);
        ok(L.W <= D.maxCardW + 400, `${tag} — el ancho no se dispara (${Math.round(L.W)} u)`);
      });
    });
  });
  toolRows = toolSets[2].rows; state = {ED:0};
  ok(computeLayout(badgeStrings(),{}).toolLines.length >= 2, 'una lista larga se reparte en varios renglones');
  /* Lo que se equilibra es el ANCHO, no la cantidad de elementos: en texto
     alineado a la derecha, una huérfana es un renglón mucho más corto que el
     resto. El reparto codicioso daba aquí 2-3-1 con «Perplexity» sola
     (≈¼ del renglón más largo). */
  toolRows = [['ChatGPT','GPT-5'],['Claude','Opus 5'],['DeepL','Pro'],['Grammarly','Premium'],['Elicit',''],['Perplexity','']]
             .map(([name,model])=>({name, model})); state = {ED:0,TR:0};
  { const tl = computeLayout(badgeStrings(),{}).toolLines;
    const w = tl.map(l=>l.w);
    ok(tl.length>=2 && Math.min(...w) >= 0.5*Math.max(...w),
       `el reparto no deja huérfanas: renglón más corto = ${Math.round(100*Math.min(...w)/Math.max(...w))}% del más largo`); }
  toolRows = toolSets[3].rows; state = {ED:0};
  { const svg = renderSVG(computeLayout(badgeStrings(),{}), 'data:,', {embed:false});
    ok(svg.includes('A&lt;b&gt;&amp;&quot;c&#39;d'), 'el texto libre se escapa en el SVG');
    ok(!/aria-label="[^"]*"c/.test(svg), 'y no rompe el atributo aria-label'); }
  toolRows = [{name:'ChatGPT', model:''},{name:'DeepL', model:'Pro'}]; state = {ED:0};
  ok(badgeStrings().tools.join('|')==='ChatGPT|DeepL (Pro)', 'formato: «herramienta (modelo)», modelo opcional');
  ok(computeLayout(badgeStrings(),{}).toolLines[0].t.startsWith('Tools: '), 'la lista arranca con «Tools: »');
  toolRows = [{name:'   ', model:'GPT-5'},{name:'', model:''}];
  ok(badgeStrings().tools.length===0, 'filas sin nombre no se imprimen');
  toolRows = [{name:'ChatGPT', model:'GPT-5'}]; state = {N:true};
  ok(badgeStrings().tools.length===0, 'con «sin uso» (N) no se imprimen herramientas');
  toolRows = [];

  // 7bis. alto constante: las etiquetas se alinean entre sí en una página
  ok(heights.size===1, `alto uniforme en todo el vocabulario: ${[...heights].join(', ')} u`);

  // 8. reglas de la notación (preprint §4.1, §4.4, §4.5)
  const P = BADGE.prefix;                       // 'AI: '
  state = {N:true};
  ok(badgeStrings().canonical==='AI: N', 'N produce la cadena «AI: N»');
  ok(badgeStrings().details===T.noUse, 'N no muestra extensión: es una afirmación de no uso, no un nivel');
  state = {}; onToggleSilently('TG',true); onToggleSilently('N',true);
  ok(JSON.stringify(state)==='{"N":true}', 'N es excluyente: borra las demás tareas');
  state = {}; onToggleSilently('N',true); onToggleSilently('TR',true);
  ok(!state.N && state.TR===0, 'marcar una tarea desactiva N y NO inventa extensión (arranca en 0)');

  // FORMA DE LA ETIQUETA: AI una sola vez, «: », códigos unidos por «+»
  state = {RF:2, ED:1, TR:3};
  ok(badgeStrings().codes.join(',')==='ED,TR,RF', 'los códigos se ordenan por actividad STM, no por clic');
  ok(badgeStrings().title==='AI: ED+TR+RF', 'título: AI una sola vez y códigos separados por «+»');
  ok(badgeStrings().canonical==='AI: ED:1+TR:3+RF:2', 'cadena canónica con las extensiones pegadas a su código');
  const cs = badgeStrings().canonical;
  ok((cs.match(/AI/g)||[]).length===1, '«AI» aparece exactamente una vez en toda la cadena');
  ok(cs.startsWith('AI: '), 'después de AI van siempre dos puntos y un espacio');

  /* 8octies. CRÉDITO A QUIENES COLABORARON. Es crédito a personas reales: si un

  { const prevL = $('lang').value;

         `[${L}] va después de quién desarrolló y antes de la codificación`);

         que se pierda en un idioma es un crédito incompleto, no un detalle. */
      const bloque = $('aboutBody').innerHTML;
      const faltan = [];
      APP.collab.forEach(c=>{
        if(!bloque.includes(c.name))  faltan.push(c.name);
        if(!bloque.includes(c.orcid)) faltan.push(c.name+' (identificador)');
        if(!bloque.includes(c.email)) faltan.push(c.name+' (correo)');

      ok(malEnlazados.length===0,
         `[${L}] el identificador y el correo son enlaces reales${malEnlazados.length?': '+malEnlazados.map(c=>c.name).join(', '):''}`);

    const digito = o => { let t=0; for(const c of o.replace(/-/g,'').slice(0,15)) t=(t+ +c)*2;

  /* 8decies. EL CONTROL DE EXTENSIÓN. Una estudiante encontró confuso el

  /* 8duodecies. PROCEDENCIA. Una etiqueta sin nombre de sistema es huérfana:

    ok(APP.notation && APP.notation !== APP.version,

       composición, así que cambiar la regla la rompía aunque nada se tocara,
       y además solo miraba el ancho. Desde que la marca puede crecer, lo
       primero que topa es el BORDE DE LA TARJETA, que aquella no vigilaba. */
    let peorTapa = 1e9, peorSuelo = 1e9, peorCol = 1e9, maxLineas = 0;

        peorSuelo = Math.min(peorSuelo, (L2.cardY + L2.cardH) - (L2.markTop + L2.markH));
        /* a lo ancho: ni se sale de la tarjeta por la izquierda ni invade la
           columna del contenido */
        const medio = Math.max(
          widthOf(L2.sysName, L2.sysNameSize, 700, 0.05),
          ...L2.sysDescLines.map(t => widthOf(t, L2.sysDescSize, D.sysDescWeight, 0.2))) / 2;
        peorCol = Math.min(peorCol, (L2.titleX - 6) - (L2.sysCx + medio),

  { let semilla = 20260921;
    const rnd = () => (semilla = (semilla*1103515245 + 12345) % 2147483648) / 2147483648;
    const nombres = [['ChatGPT','GPT-5'],['Claude','Opus 5'],['DeepL','Pro'],['Grammarly',''],['Illustrator','2026'],['Elicit','']];
    let incoherencias = [], casos = 0;
    for(let k=0; k<300; k++){
      state = {};
      ORDER.forEach(c=>{ if(rnd()<0.35) state[c] = Math.floor(rnd()*5); });
      if(!Object.keys(state).length) state = {N:true};
      toolRows = nombres.filter(()=>rnd()<0.3).map(([name,model])=>({name,model}));

        casos++;
        const txt = proseText(pl), P = PROSE[pl];
        const err = m => incoherencias.push(`${s2.canonical} [${pl}]: ${m}`);
        // 1. la prosa cita la cadena exacta de la etiqueta
        if(!txt.includes(P.label + s2.canonical + '.')) err('no cita la cadena de la etiqueta');
        if(state.N){
          if(!txt.startsWith(P.none)) err('N sin la declaración negativa');
          if(txt.includes(P.tools) || txt.includes('[')) err('N con herramientas o marcadores');
          return;
        }
        // 2. mismas tareas, en el mismo orden (el de la etiqueta = orden STM)
        const pos = s2.codes.map(c=> txt.indexOf(lcFirst(TASKS.find(t=>t.code===c)[pl])));
        if(pos.some(x=>x<0)) err('falta la descripción de alguna tarea de la etiqueta');
        if(pos.some((x,i)=>i && x<=pos[i-1])) err('tareas en otro orden que la etiqueta');
        const otras = ORDER.filter(c=>!s2.codes.includes(c))
                           .filter(c=> txt.includes(lcFirst(TASKS.find(t=>t.code===c)[pl])));
        if(otras.length) err('menciona tareas que la etiqueta no declara: '+otras.join(','));
        // 3. una entrada enumerada por tarea
        const enumeradas = (txt.match(/\([a-h]\) /g)||[]).length;
        if(s2.codes.length>1 && enumeradas!==s2.codes.length) err(`enumera ${enumeradas} tareas y la etiqueta tiene ${s2.codes.length}`);
        // 4. extensión: exactamente la declarada, ni una más
        s2.codes.forEach((c,i)=>{
          const lv = state[c]||0;
          const desde = pos[i], hasta = i+1<pos.length ? pos[i+1] : txt.length;
          const tramo = txt.slice(desde, hasta);
          const esperado = lv ? P.extent(EXTENTS[lv][pl].split(':')[0].toLowerCase()) : null;
          const hay = [1,2,3,4].filter(n=> tramo.includes('('+P.extent(EXTENTS[n][pl].split(':')[0].toLowerCase())+')'));
          if(lv && (hay.length!==1 || !tramo.includes('('+esperado+')'))) err(`${c}: la extensión no coincide con :${lv}`);
          if(!lv && hay.length) err(`${c}: la prosa inventa una extensión que no se declaró`);
        });

      });

  ok(qrWarning==='', 'URL corta: QR sin advertencias');
  /* Los avisos se comprueban por CONDUCTA y en los tres idiomas, no por su
     texto castellano: antes bastaba con cambiar el idioma por defecto para
     que estas dos pruebas pasaran a verde sin que nadie tocara la guarda. */
  { const prevL = lang;
    LANG_ALL.forEach(l=>{
      lang = l; U = UI[l];
      qrDataUrl('https://investiga.uned.ac.cr/'+'a'.repeat(200), true);
      const denso = qrWarning;
      qrDataUrl('https://investiga.uned.ac.cr/'+'a'.repeat(2000), true);
      const pasado = qrWarning;
      ok(denso!=='' && denso===U.qrDense(denso.match(/\d+/)[0]),
         `${l}: URL densa avisa que puede no leerse impresa`);
      ok(pasado!=='' && pasado!==denso,
         `${l}: URL sobre capacidad se bloquea en vez de truncar en silencio`);
    });
    lang = prevL; U = UI[prevL]; }
  { const pl=lang; lang='en'; U=UI.en;
    qrDataUrl('https://investiga.uned.ac.cr/'+'a'.repeat(2000), true);
    ok(/Shorten it/.test(qrWarning), 'los avisos del QR también se traducen');
    lang=pl; U=UI[pl]; }
  qrDataUrl('https://investiga.uned.ac.cr/cienciaabierta', true);
  ok(qrWarning==='', 'la advertencia se limpia al volver a una URL válida');
  }

  // 11. exportación real
  state = {TR:1, ED:2, TG:1};
  const Lx = computeLayout(badgeStrings(), {ax3:'none', qrSafe:true});
  const svgx = renderSVG(Lx, qrDataUrl('https://investiga.uned.ac.cr/cienciaabierta', true), {embed:true});
  ok(svgx.length>200 && svgx.startsWith('<svg'), 'SVG exportable generado');
  ok(!fonts.ready || svgx.includes('@font-face'), 'la tipografía va incrustada en el SVG exportado');

  renderPng(svgx, Lx, 2).then(cv=>{
    const c2 = cv.getContext('2d');
    const px = c2.getImageData(Math.round(cv.width*0.5), Math.round(cv.height*0.5), 1, 1).data;
    const okPng = cv.width===Math.round(Lx.W*2) && cv.height===Math.round(Lx.H*2) && px[3]>0;
    log.push(`<span class="${okPng?'p':'f'}">${okPng?'OK  ':'FAIL'}</span> PNG 2× rasterizado (${cv.width}×${cv.height}, píxel central opaco)`);
    finish(okPng?1:0, okPng?0:1);
  }).catch(e=>{
    log.push(`<span class="f">FAIL</span> PNG 2×: ${e.message}`);
    finish(0,1);
  });

  function finish(p,f2){
    pass+=p; fail+=f2;
    const limpio = log.map(l=>l.replace(/<[^>]+>/g,''));
    console.log(`${pass} pruebas OK · ${fail} fallidas${skipped?` · ${skipped} omitidas (sin conexión)`:''}\n`
      + `punto más apretado del sistema: ${tightest.g.toFixed(1)} u — ${tightest.what}\n`
      + '─'.repeat(52) + '\n' + limpio.join('\n'));
    state = saved;                       // dejar la app como estaba antes de las pruebas
    toolRows = savedTools; buildTools();
    lang = $('lang').value; applyLang();
    buildControls(); render();
    window.__testResult = {pass, fail, skipped, tightest, lines: limpio};
  }
}
function onToggleSilently(code, checked){
  if(code==='N'){ state = checked ? {N:true} : {}; }
  else if(checked){ delete state.N; state[code]=0; }
  else delete state[code];
}

/* ====================== GUÍA FLOTANTE (tooltip) ========================
   Un solo elemento reutilizado para todo lo que lleve data-tip. Se muestra
   con el mouse, con el foco del teclado y al tocar, y se recoloca para no
   salirse de la pantalla: si no cabe arriba, baja y la flecha se da vuelta.
   ====================================================================== */
const tipEl = document.createElement('div');
tipEl.id = 'tip';
document.body.appendChild(tipEl);
let tipFor = null;

function showTip(el){
  const head = el.getAttribute('data-tip');
  if(!head) return;
  const sub = el.getAttribute('data-tip-sub');
  tipEl.innerHTML = `<b>${esc(head)}</b>` + (sub ? `<small>${esc(sub)}</small>` : '');
  tipEl.classList.add('on');
  const r = el.getBoundingClientRect();
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = Math.max(8, Math.min(r.left + r.width/2 - w/2, innerWidth - w - 8));
  let y = r.top - h - 9;
  if(y < 8){ y = r.bottom + 9; tipEl.classList.add('below'); }
  else tipEl.classList.remove('below');
  tipEl.style.left = x + 'px';
  tipEl.style.top  = y + 'px';
  tipEl.style.setProperty('--ax', (r.left + r.width/2 - x) + 'px');
  tipFor = el;
}
function hideTip(){ tipEl.classList.remove('on'); tipFor = null; }

document.addEventListener('mouseover', e=>{
  const el = e.target.closest('[data-tip]');
  if(el){ if(el !== tipFor) showTip(el); }
  else if(tipFor) hideTip();
});
document.addEventListener('focusin',  e=>{ const el=e.target.closest('[data-tip]'); if(el) showTip(el); });
document.addEventListener('focusout', hideTip);
document.addEventListener('click',    e=>{ const el=e.target.closest('[data-tip]'); if(el) showTip(el); });  // táctil
window.addEventListener('scroll', hideTip, true);
window.addEventListener('resize', hideTip);

/* ============================ ARRANQUE ================================= */
['qrUrl'].forEach(id=>$(id).addEventListener('input', render));
$('pngScale').addEventListener('change', render);
$('lang').addEventListener('change', ()=>{ lang = $('lang').value; applyLang(); buildControls(); buildTools(); render(); });
// Manual y «acerca de»: cualquier elemento con data-open abre su panel.
// <dialog> nativo: Esc cierra y el foco queda atrapado dentro sin código extra.
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-open]');
  if(!b) return;
  e.preventDefault(); hideTip();
  const d = $(b.getAttribute('data-open'));
  d.showModal(); d.querySelector('.dlg-in').scrollTop = 0;
});
document.querySelectorAll('dialog.dlg').forEach(d=>
  d.addEventListener('click', e=>{ if(e.target === d) d.close(); }));   // clic fuera del panel = cerrar
$('btnProse').addEventListener('click', ()=>{
  const card = $('proseCard'), abrir = card.hidden;
  card.hidden = !abrir;
  $('btnProse').setAttribute('aria-expanded', String(abrir));
  if(abrir){ renderProse(); card.scrollIntoView({behavior:'smooth', block:'nearest'}); }
});
$('docLang').addEventListener('change', ()=>{
  docLang = $('docLang').value; applyDocLang(); render(); renderProse();
});
$('btnCopy').addEventListener('click', async ()=>{
  const txt = proseText(docLang), b = $('btnCopy');
  let ok = false;
  try{ await navigator.clipboard.writeText(txt); ok = true; }
  catch(e){                                   // file:// u origen no seguro: vía clásica
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove();
  }
  b.textContent = ok ? U.copied : U.copyFail;
  setTimeout(()=>{ b.textContent = U.btnCopy; }, 1800);
});
$('btnAddTool').addEventListener('click', ()=>{
  if(toolRows.length >= D.toolsMax) return;
  toolRows.push({name:'', model:''});
  buildTools();
  const filas = $('toolList').querySelectorAll('.tool-row');
  filas[filas.length-1].querySelector('input').focus();
});
['optQrSafe','optEmbed','optDark'].forEach(id=>$(id).addEventListener('change', render));

function buildLangOptions(){
  [['lang', lang], ['docLang', docLang]].forEach(([id, val])=>{
    $(id).innerHTML = LANGS.map(l =>
      `<option value="${l}"${l===val?' selected':''}>${LANGNAME[l]}</option>`).join('');
  });
}

state = {N:true};   // arranca en la declaración negativa: quien no usó IA no marca nada
/* Si el idioma por defecto dejara de ofrecerse, se cae al primero disponible
   en vez de quedar en un selector vacío. */
if(!LANGS.includes(lang))    lang    = LANGS.includes('en') ? 'en' : LANGS[0];
if(!LANGS.includes(docLang)) docLang = lang;
buildLangOptions();
applyDocLang();
applyLang();
buildControls();
buildTools();
render();
loadFonts();

window.__app = {computeLayout, renderSVG, badgeStrings, runSelfTest, get state(){return state;}, set state(v){state=v;}};
</script>
